coverage_assertions:
  - SHORT_NAME and LONG_NAME never generate position_side from a naked token.
  - Explicit Chinese 空头 or 多头 may generate only candidate_qualifier_observation.
  - SHORT name with 多头 comment is represented as conflict, not resolved.
  - SOURCE_TYPE and TARGET_CTPTY_ID never generate flow_side directly.
  - Source-target mapping context is TRADEFLOW-only and remains a technical candidate.
  - ID STATUS TYPE AMOUNT and CURRENCY remain generic attributes rather than business concepts.
  - CREATED UPDATED and PUSH_BATCH are isolated from business navigation.
  - FEP-001 and FEP-023 anchor equal column names to distinct physical identities through their full physical_field values.
  - Empty comments preserve MISSING_INFORMATION and prohibit confirmation.
  - No explicit extension-slot field is asserted; extension-slot observation is NOT_OBSERVED in this frozen sample.
