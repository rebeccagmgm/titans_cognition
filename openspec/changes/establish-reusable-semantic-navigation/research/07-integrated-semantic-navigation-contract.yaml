      action: Freeze the 07 contract, validation plan, source manifest, and hashes; consume an independent preimplementation disposition.
      input: [reviewed_predecessor_07_bundle, candidate_07_bundle, implementation_review_source_manifest, preimplementation_review_09]
      output: [preimplementation_review_gate_result, bounded_allowed_step_range]
      gate: ACCEPT or REWORK_BOUNDED_AUTHORIZATION with an explicit bounded allowed-step range; this authorization is not a PASS GateResult
      current_disposition: REWORK_BOUNDED_AUTHORIZATION
      allowed_steps: ['07c:step:01-provider', '07c:step:02-full-evidence-pack']
      prohibited_steps_until_new_independent_review: ['07c:step:03-suite-a', '07c:step:04-handoff', '07c:step:05-bounded-adjudication', '07c:step:06-suite-b-c', '07c:step:07-fix-decisive-failures', '07c:step:08-generate-page', '07c:step:09-click-journeys', '07c:step:10-independent-review', '07c:step:11-business-acceptance-request', '07c:step:12-second-schema']
      failure_stop: [review missing, hash mismatch, manifest omission, STOP, DEFER, attempted step outside allowed range]
      status: REWORK_BOUNDED_AUTHORIZATION
    - step_id: '07c:step:01-provider'
      sequence: 1
      action: Implement the field evidence preparation Provider.
      input: [this_contract, stage0_schema]
      output: [versioned_provider, output_schema]
      gate: raw immutability, 16 blocks, rule versioning, no semantic output, unique config and result schema identities
      failure_stop: [schema mismatch, schema identity collision, identity mismatch, provenance omission, semantic conclusion emitted]
      status: NOT_STARTED
      authorization: ALLOWED_BY_STEP_00_REWORK_SCOPE
      predecessor_gate_result: NOT_APPLICABLE_FIRST_EXECUTION_STEP
    - step_id: '07c:step:02-full-evidence-pack'
      sequence: 2
      action: Generate a versioned Evidence Pack for all 13611 fields.
      input: [versioned_provider, frozen_stage0]
      output: [full_evidence_pack, manifest]
      gate: one package per physical_column_id, dual hashes, explicit disposition
      failure_stop: [missing field, duplicate identity, hash mismatch, silent exclusion]
      status: NOT_STARTED
      authorization: ALLOWED_BY_STEP_00_REWORK_SCOPE
      predecessor_gate_result: '07c:step:01-provider PASS plus exact content hash'
    - step_id: '07c:step:03-suite-a'
      sequence: 3
      action: Execute Suite A and review failures.
      input: [full_evidence_pack, suite_a]
      output: [source_verification_result, rule_execution_result]
      gate: all 23 cases executed at the preparation layer
      failure_stop: [raw mismatch, identity merge, hash mismatch, prohibited inference]
      status: NOT_STARTED
      authorization: BLOCKED_PENDING_NEW_PREIMPLEMENTATION_REVIEW
      predecessor_gate_result: '07c:step:02-full-evidence-pack PASS is necessary but not sufficient'
    - step_id: '07c:step:04-handoff'
      sequence: 4
      action: Build the P1-to-P2 semantic handoff adapter.
      input: [suite_a_reviewed_pack, semantic_handoff_contract]
      output: [typed_p2_candidates]
      gate: all 16 P1 blocks routed, all input enums closed, all 8 field attributes and 12 qualifier dimensions reachable at P2, candidates only, P2 status vocabulary closed, no P3 dependency, conflicts and unresolved retained
      failure_stop: [unrouted input block, unreachable field attribute or qualifier, undefined observation vocabulary, P3-to-P2 cycle, observation becomes decision, provenance lost, technical leak]
      status: NOT_STARTED
    - step_id: '07c:step:05-bounded-adjudication'
      sequence: 5
      action: Run bounded semantic adjudication for the six Readers.
      input: [typed_p2_candidates, six_reader_contracts]
      output: [versioned_p3_decisions, p4_reader_candidates]
      gate: one-way P2-to-P3 acceptance, immutable P2 candidates, six unique identities, expression-level state, visible blockers
      failure_stop: [P3 rewrites or regenerates P2, combined identity, object anchor absent, entry seed treated as evidence]
      status: NOT_STARTED
    - step_id: '07c:step:06-suite-b-c'
      sequence: 6
      action: Execute Suite B and Suite C.
      input: [p3_decisions, p4_candidates, suite_b, suite_c]
      output: [semantic_adjudication_results, cross_layer_results]
      gate: all 27 and 12 cases recorded; nonlocatable cases remain NOT_EVALUABLE
      failure_stop: [unexecuted recorded as success, historical Gold rewritten, decisive failure]
      status: NOT_STARTED
    - step_id: '07c:step:07-fix-decisive-failures'
      sequence: 7
      action: Correct known misclassifications and all decisive failures.
      input: [layered_failures, counterevidence]
      output: [corrected_candidate_bundle]
      gate: no weakened tests, hidden conflict, or missing direct Reader positive
      failure_stop: [test weakened, evidence removed, Trade or Position positive absent]
      status: NOT_STARTED
    - step_id: '07c:step:08-generate-page'
      sequence: 8
      action: Generate the new single-page Reader candidate projection.
      input: [frozen_p0_to_p4_bundle]
      output: [candidate_page, page_manifest]
      gate: traceability, expression-level status, governance queue, link integrity
      failure_stop: [untraceable expression, open hidden blocker, broken object link]
      status: NOT_STARTED
    - step_id: '07c:step:09-click-journeys'
      sequence: 9
      action: Validate real user click journeys.
      input: [candidate_page, defined_user_journeys]
      output: [usability_validation_record]
      gate: entry to Reader to expression to field to object detail and return
      failure_stop: [aggregate-only dead end, broken link, denominator unclear]
      status: NOT_STARTED
    - step_id: '07c:step:10-independent-review'
      sequence: 10
      action: Hand an isolated review pack to a new independent Agent.
      input: [candidate_page, page_manifest, layered_results, review_case_pack]
      output: [separate_future_independent_review_file]
      gate: positive, ambiguous, misleading-name, technical, and falsification cases present
      failure_stop: [inputs not isolated, representative cases missing, vacuous gate]
      status: NOT_STARTED
    - step_id: '07c:step:11-business-acceptance-request'
      sequence: 11
      action: Request user business acceptance only after the independent review allows it.
      input: [future_independent_review, candidate_page]
      output: [user_owned_business_acceptance_decision]
      gate: independent disposition is future ACCEPT and no user-owned issue remains
      failure_stop: [future REWORK, future STOP, future DEFER, unresolved business decision]
      status: NOT_STARTED
    - step_id: '07c:step:12-second-schema'
      sequence: 12
      action: Continue with a second Schema only after separate authorization.
      input: [D-010_user_authorization, independent_second_schema_case_pack, new_profile_identity_collision_scan, encoding_and_parser_failure_inventory]
      output: [second_schema_research_results]
      gate: separate Manifest, Gold, counterexamples, independent review, and collision-free or traceably surrogated physical identity within the new run/profile scope
      failure_stop: [authorization absent, corpus absent, identity collision unresolved, parser failure hidden, encoding failure hidden, portability assumed]
      status: DEFERRED
  gate_result_case_contract_by_step:
    registry_ref: 07-integrated-validation-plan.yaml#gate_expected_case_sets
    required_step_refs_exact: ['07c:step:00-preimplementation-review', '07c:step:01-provider', '07c:step:02-full-evidence-pack', '07c:step:03-suite-a', '07c:step:04-handoff', '07c:step:05-bounded-adjudication', '07c:step:06-suite-b-c', '07c:step:07-fix-decisive-failures', '07c:step:08-generate-page', '07c:step:09-click-journeys', '07c:step:10-independent-review', '07c:step:11-business-acceptance-request', '07c:step:12-second-schema']
    symbolic_expected_case_sources_allowed: false
    exact_case_refs_required_per_step: true
    exact_direct_positive_evidence_bindings_required_where_applicable: true
    observed_must_equal_expected: true
  sequence_enforcement:
    predecessor_pass_and_hash_required: true
    exact_expected_and_observed_case_refs_required: true
    not_evaluable_whitelist_exact: [E02, E03, E04]
    out_of_order_missing_or_relabel_effect: STOP

