      allowed_field_attributes: [IDENTIFIER, DESCRIPTIVE_TEXT, BUSINESS_OBJECT_STATE, MEASURE, CURRENCY, TIME]
      allowed_qualifiers: [position_side, observation_time_role, currency_basis, aggregation_state, availability_condition, estimation_status, measure_basis]
      allowed_entry_refs: ['entry:position:contract-envelope', 'entry:position:valuation-risk']
