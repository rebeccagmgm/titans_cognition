field_evidence_provider:
  provider_id: '07c:provider:field-evidence-preparation'
  status: REQUIRES_IMPLEMENTATION
  scope:
    schema_ref: TITANS_TRADEFLOW
    physical_object_count: 477
    physical_column_count: 13611
    downstream_current_workset_field_count: 5512
    rule: The downstream workset does not bound Provider input.
  rule_inventory:
    unique_rule_id_count: 77
    generic_rule_count: 69
    tradeflow_profile_rule_count: 8
    execution_status: RULE_EXECUTION_NOT_PERFORMED
  one_record_per: [run_id, profile_ref, schema_name, physical_column_id]
  output_block_count: 16
  required_output_blocks:
    - physical_identity
    - raw_physical_fact
    - preparation_disposition
    - normalized_lexical_form
    - tokens
    - protected_phrases
    - abbreviation_observations
    - generic_attribute_observations
    - technical_observations
    - contextual_evidence
    - candidate_qualifier_observations
    - conflicts
    - unresolved_items
    - applied_rule_ids
    - provenance
    - evidence_status
  preparation_dispositions:
    PREPARED: Complete Evidence Pack; eligible for an explicitly named downstream selection.
    EXCLUDED: Evidence Pack retained, but a named downstream profile excludes it with a reason.
    DEFERRED: Available facts retained, but a source or encoding gap blocks a complete Pack.
  evidence_status_values: [SUPPORT, CONTRADICT, CONTEXT_ONLY, NOT_APPLICABLE, NOT_OBSERVED]
  technical_observation_status_values: [CANDIDATE, UNRESOLVED]
  technical_class_values:
    - TECHNICAL_IDENTIFIER
    - AUDIT_ACTOR
    - AUDIT_TIME
    - INGESTION_METADATA
    - BATCH_METADATA
    - LINEAGE_METADATA
    - EXTENSION_SLOT
    - SOFT_DELETE
    - VERSION_CONTROL
    - UNRESOLVED_TECHNICAL
  provenance:
    source_artifacts_cardinality: '1..*'
    current_tradeflow_required_roles: [COLUMN_PHYSICAL_FACT, OBJECT_PHYSICAL_FACT]
    derived_item_required_fields:
      - observation_id
      - physical_column_ref
      - source_span
      - rule_refs
      - source_artifact_refs
    current_source_artifact_refs:
      - '07c:source:stage0-columns'
      - '07c:source:stage0-objects'
  protected_phrase_arbitration:
    phase_1: Longest registered outer phrase creates a GUARD span and suppresses naked semantic-sensitive tokens.
    phase_2: A registered nested phrase may be emitted as OBSERVATION_UNIT with its own span and provenance.
    examples:
      - outer_guard: CTPTY_SHORT_NAME
        nested_observation_unit: SHORT_NAME
        forbidden_naked_token: SHORT
      - outer_guard: SOURCE_CTPTY_ID
        nested_observation_unit: SOURCE_CTPTY
        forbidden_naked_token: SOURCE
  test_sentinel_adapter:
    NOT_APPLICABLE_TECHNICAL_CLASS: Interpret as an empty technical_observations array, not a Provider enum value.
    TECHNICAL_ISOLATED: Interpret as a semantic handoff route, not a P1 unresolved code.
    COMPETING_MEASURE_INTERPRETATION: Route to P2 semantic conflict typing; do not add it silently to the P1 rule inventory.
  invariants:
    - Raw facts are immutable.
    - Every physical field produces a retained package or an explicit blocking record.
    - EXCLUDED never means deleted.
    - Technical observations remain CANDIDATE or UNRESOLVED until rule execution and validation.
    - No output block contains a formal business concept, formal qualifier, Reader identity, or publication decision.

