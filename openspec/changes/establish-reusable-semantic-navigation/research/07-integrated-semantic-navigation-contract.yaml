      publication_gate: [COMMON_PUBLICATION_GATE, MARGIN_DIRECT_POSITIVE_PRESENT, MARGIN_EXPRESSIONS_SEPARATE, MARGIN_DIRECTION_ADJUDICATED]
      current_blockers: [FIELD_EVIDENCE_NOT_IMPLEMENTED, MARGIN_DIRECT_POSITIVE_REQUIRED, MARGIN_DIRECTION_UNRESOLVED, GOLD_PENDING]

