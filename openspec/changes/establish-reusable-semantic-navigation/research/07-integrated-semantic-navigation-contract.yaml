      source_layer: P0
      allowed_roles: [SUPPORT, CONTRADICT, NOT_OBSERVED]
    - evidence_type_id: '07c:evidence-type:physical-object'
      source_layer: P0
      allowed_roles: [SUPPORT, CONTRADICT, CONTEXT_ONLY]
    - evidence_type_id: '07c:evidence-type:prepared-observation'
      source_layer: P1
      allowed_roles: [SUPPORT, CONTRADICT, CONTEXT_ONLY, NOT_APPLICABLE, NOT_OBSERVED]
    - evidence_type_id: '07c:evidence-type:configuration-seed'
      source_layer: CONFIGURATION
      allowed_roles: [CONTEXT_ONLY]
      counts_as_independent_evidence: false
    - evidence_type_id: '07c:evidence-type:wiki-weak-context'
      source_layer: EXTERNAL_CONTEXT
      allowed_roles: [CONTEXT_ONLY]
      counts_as_decisive_evidence: false
    - evidence_type_id: '07c:evidence-type:semantic-review-decision'
      source_layer: P3
      allowed_roles: [DECISION_PROVENANCE]
      is_evidence: false
  claim_requirements:
    - Every candidate identifies method, physical_column_ref, evidence refs, counterevidence refs, and required next evidence.
    - Every decision retains rejected candidates and conflict refs.
    - Human review is a decision and cannot rewrite physical evidence.
    - Numeric scores remain method-local ranking signals and are not calibrated probabilities.

conflict_contract:
  conflict_contract_id: '07c:conflict:cross-layer'
  required_fields: [conflict_ref, physical_column_ref, conflict_type_ref, evidence_a_ref, evidence_b_ref, candidate_interpretations, prohibited_auto_resolution, required_next_evidence, review_status]
  conflict_types:
    - {conflict_type_id: '07c:conflict-type:name-comment', layer: P1, publication_effect: BLOCK_EXPRESSION}
    - {conflict_type_id: '07c:conflict-type:competing-object-anchor', layer: P2, publication_effect: BLOCK_READER_IF_IDENTITY_CRITICAL}
    - {conflict_type_id: '07c:conflict-type:competing-qualifier', layer: P2, publication_effect: BLOCK_EXPRESSION_OR_READER_IF_DEFINITION_CRITICAL}
    - {conflict_type_id: '07c:conflict-type:semantic-measure-interpretation', layer: P2, publication_effect: BLOCK_EXPRESSION}
    - {conflict_type_id: '07c:conflict-type:order-trade-identity', layer: P3, publication_effect: BLOCK_BOTH_READERS}
    - {conflict_type_id: '07c:conflict-type:missing-information', layer: P1, publication_effect: DEFER_DECISION}
  blocking_rules:
    - A conflict never auto-resolves to a single interpretation.
    - A noncritical expression conflict does not mark unrelated expressions unsupported, but remains visible.
    - An identity-critical or stable-definition conflict blocks the whole Reader candidate.
    - An unresolved formal qualifier blocks that expression and blocks a Reader when the qualifier is definition-critical.

governance_states:
  registry_id: '07c:registry:governance-states'
  states:
    - {state_id: OUT_OF_SCOPE, meaning: Explicitly outside this research boundary; retain source and reason.}
    - {state_id: NOT_IN_FIRST_READER_SCOPE, meaning: Semantically relevant but outside the first six Readers.}
    - {state_id: ATTRIBUTE_LAYER, meaning: Attribute or expression rather than business concept identity.}
    - {state_id: TECHNICAL_CANDIDATE, meaning: Candidate or unresolved technical observation retained outside business Readers.}
    - {state_id: EVIDENCE_INSUFFICIENT, meaning: Evidence cannot support a P3 decision.}
    - {state_id: CONFLICT, meaning: Locatable evidence disagrees and prohibits automatic resolution.}
    - {state_id: NOT_EVALUABLE, meaning: Evaluation prerequisite is absent; no physical field may be fabricated.}
    - {state_id: TRUE_UNKNOWN, meaning: Unknown after complete processing at a declared grain.}
    - {state_id: NOT_YET_PROCESSED, meaning: The item has not reached the relevant layer.}
  preparation_status_separation:
    preparation_values: [PREPARED, EXCLUDED, DEFERRED]
    rule: Preparation disposition is not a semantic, governance, or publication status.

