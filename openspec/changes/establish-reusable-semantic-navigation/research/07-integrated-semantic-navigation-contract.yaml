    technical_class_values:
      - TECHNICAL_IDENTIFIER
      - AUDIT_ACTOR
      - AUDIT_TIME
      - INGESTION_METADATA
      - BATCH_METADATA
      - LINEAGE_METADATA
      - EXTENSION_SLOT
      - SOFT_DELETE
      - VERSION_CONTROL
      - UNRESOLVED_TECHNICAL
    candidate_qualifier_values:
      position_side: [LONG, SHORT]
      trade_side: [BUY, SELL]
      cashflow_direction: [PAY, RECEIVE]
      variability: [DYNAMIC, FIXED]
      currency_basis: [ORIGINAL_CURRENCY, LOCAL_CURRENCY, UNDERLYING_CURRENCY, SETTLEMENT_CURRENCY]
  required_output:
    collections:
      - business_object_anchor_candidates
      - attribute_expression_ownership_candidates
      - field_attribute_candidates
      - qualifier_candidates
      - counterevidence_refs
      - conflict_refs
      - required_next_evidence
    candidate_record_required_fields:
      - candidate_id
      - candidate_version
      - run_id
      - profile_ref
      - schema_name
      - physical_column_ref
      - candidate_type
      - candidate_value_ref
      - input_observation_refs
      - context_refs
      - counterevidence_refs
      - conflict_refs
      - rule_refs
      - required_next_evidence
      - semantic_resolution_status
    candidate_identity:
      deterministic_key: [run_id, profile_ref, schema_name, physical_column_id, candidate_type, candidate_value_ref, evidence_hash, candidate_version]
      candidate_id_derivation: SHA256_CANONICAL_SERIALIZATION_OF_DETERMINISTIC_KEY
      idempotency: Equal deterministic keys must produce one content-equivalent candidate version.
      duplicate_effect: STOP
    semantic_resolution_status_values: [CANDIDATE, UNBOUND, CONFLICT, DEFERRED, NOT_APPLICABLE]
    prohibited_semantic_resolution_status_values: [ACCEPTED, REJECTED, PUBLISHED]
    unregistered_candidate_contract:
      discovery_layers_open: [P1, P2]
      formal_registry_layer_closed: P3
      record_type: UNREGISTERED_CANDIDATE
      required_fields: [run_id, profile_ref, schema_name, candidate_version, physical_column_ref, raw_span, provenance_refs, observed_value_raw, suggested_dimension, deferred_reason, evidence_hash]
      semantic_resolution_status: DEFERRED
      allowed_destination: GOVERNANCE_QUEUE_ONLY
      p3_eligibility: false
      reader_eligibility: false
      new_dimension_counterexample:
        observed_value_raw: NOVEL_PAYMENT_TIMING_BASIS
        suggested_dimension: payment_timing_basis
        expected_result: UNREGISTERED_CANDIDATE
        prohibited_result: silent_drop_or_dynamic_P3_registry_extension
  p1_to_p2_candidate_formation_gate:
    direction: P1_TO_P2_ONLY
    p3_input_allowed: false
    formation_phases:
      - phase: BASE_CANDIDATES
        consumes: [p1_provider_blocks]
        outputs: [business_object_anchor_candidates, attribute_expression_ownership_candidates, direct_and_composite_field_attribute_candidates, direct_provider_qualifier_candidates]
      - phase: COMPOSITE_QUALIFIER_CANDIDATES
        consumes: [immutable_p1_evidence, immutable_base_candidates]
        outputs: [semantic_only_qualifier_candidates]
        p3_input_allowed: false
    qualifier_candidate_check_set_id: '07c:checkset:p1-to-p2-qualifier-candidate'
    qualifier_candidate_source_modes:
      DIRECT_PROVIDER_OBSERVATION:
        dimensions: [position_side, trade_side, cashflow_direction, variability, currency_basis]
        source_block: candidate_qualifier_observations
      COMPOSITE_SEMANTIC_EVIDENCE:
        dimensions: [observation_time_role, party_relationship_role, aggregation_state, availability_condition, estimation_status, measure_basis, flow_side]
        source_blocks: [generic_attribute_observations, abbreviation_observations, raw_physical_fact, contextual_evidence, provenance, conflicts]
        requires: [declared_composite_mapping, immutable_base_candidate, explicit_non_token_evidence]
    qualifier_candidate_checks:
      - source_mode_is_declared
      - source_dimension_and_value_are_in_canonical_qualifier_registry
      - candidate_route_is_declared
      - object_applicability_candidate_is_bounded
      - independent_comment_or_context_is_cited
      - qualifier_dimension_is_compatible_with_candidate_expression
    generic_attribute_status_routes:
      CANDIDATE: APPLY_THE_EXPLICIT_ATTRIBUTE_VALUE_MAPPING
      UNBOUND_ATTRIBUTE_OBSERVATION: EMIT_REQUIRED_NEXT_EVIDENCE_WITH_UNBOUND_STATUS
    open_conflict_behavior: Emit all interpretations with semantic_resolution_status CONFLICT and retain conflict_refs; do not emit a promotable qualifier candidate.
    missing_object_applicability_behavior: Emit required_next_evidence and an UNBOUND assessment; do not emit a promotable qualifier candidate.
    abbreviation_candidate_behavior: A resolved expansion may corroborate another candidate as context only; it cannot create an object, attribute, qualifier, or Reader candidate by itself.
    unrecognized_abbreviation_behavior: Emit required_next_evidence with semantic_resolution_status DEFERRED; inventing an expansion is prohibited.
  p2_to_p3_semantic_acceptance_gate:
    direction: P2_TO_P3_ONLY
    consumes: [p2_candidate_record, locatable_evidence, applicable_gold_expectation, semantic_adjudication]
    formal_qualifier_acceptance_checks:
      - p2_qualifier_candidate_exists
      - object_applicability_is_confirmed
      - independent_comment_or_context_is_confirmed
      - no_blocking_conflict_remains_open
      - qualifier_dimension_compatibility_is_confirmed
      - applicable_gold_expectation_is_recorded_without_treating_NOT_EVALUABLE_as_success
      - explicit_p3_semantic_decision_is_recorded
    outputs: [accepted_qualifier_decision, rejected_qualifier_decision, deferred_qualifier_decision]
    feedback_to_p2_allowed: false
    rule: P3 may accept, reject, or defer the immutable P2 candidate; it never rewrites or regenerates that candidate.
  record_grain_and_idempotency:
    candidate:
      identity_field: candidate_id
      version_grain: [run_id, profile_ref, schema_name, candidate_id, candidate_version]
      active_uniqueness: ONE_ACTIVE_VERSION_PER_CANDIDATE_GRAIN
    decision:
      identity_field: decision_id
      deterministic_key: [run_id, profile_ref, schema_name, candidate_id, candidate_version, decision_version]
      cardinality: EXACTLY_ONE_P3_DECISION_PER_CANDIDATE_VERSION_WHEN_ADJUDICATED
      active_uniqueness: ONE_ACTIVE_DECISION_PER_CANDIDATE_VERSION
    reader_expression:
      identity_field: expression_id
      deterministic_key: [run_id, profile_ref, schema_name, reader_ref, candidate_id, candidate_version, expression_key, expression_version]
      cardinality: EXACTLY_ONE_EXPRESSION_PER_READER_EXPRESSION_KEY_AND_CANDIDATE_VERSION
      active_uniqueness: ONE_ACTIVE_EXPRESSION_PER_GRAIN
    reader_candidate:
      identity_field: reader_candidate_id
      deterministic_key: [run_id, profile_ref, schema_name, reader_ref, candidate_version, reader_candidate_version]
      cardinality: EXACTLY_ONE_READER_CANDIDATE_PER_SCOPED_VERSION
      active_uniqueness: ONE_ACTIVE_READER_CANDIDATE_PER_GRAIN
    active_state:
      deterministic_key: [run_id, profile_ref, schema_name, record_type, record_identity, candidate_version]
      cardinality: ONE_ACTIVE_STATE_PER_COMPLETE_SCOPED_GRAIN
    rerun_rule: Identical frozen inputs and rule versions produce identical IDs and content hashes.
    duplicate_or_multiple_active_effect: STOP
  technical_routing:
    pre_validation_route: TECHNICAL_CANDIDATE
    business_reader_eligibility_from_technical_observation_alone: false
    after_rule_and_suite_a: ELIGIBLE_FOR_SEPARATE_TECHNICAL_PROJECTION
    possible_dual_relevance: A separate P2 business candidate requires independent business evidence and cannot be derived from technical classification.
    raw_retention: REQUIRED
  prohibitions:
    - No P1 observation becomes a P3 decision directly.
    - No candidate overwrites physical or prepared evidence.
    - No conflict or unresolved item is dropped because another interpretation is supported.
    - No token, table name, Wiki path, score, or sibling-field vote creates a concept, formal qualifier, or Reader publication.

semantic_layers:
  layer_set_id: '07c:layers:p0-p5'
  layers:
    - layer_id: '07c:layer:p0-physical-fact'
      ordinal: P0
      name: Physical Fact
      consumes: [frozen_stage0_objects, frozen_stage0_columns, independent_artifact_hashes]
      outputs: [canonical_physical_identity, canonical_raw_physical_fact, source_locators]
      prohibits: [business_rows, normalization_overwrite, semantic_inference, cross_schema_generalization]
    - layer_id: '07c:layer:p1-prepared-evidence'
      ordinal: P1
      name: Prepared Evidence
      consumes: ['07c:layer:p0-physical-fact', versioned_generic_rules, tradeflow_profile_rules]
      outputs: [lexical_forms, tokens, protected_phrases, observations, contexts, conflicts, unresolved_items, provenance]
      prohibits: [formal_concepts, formal_field_attributes, formal_qualifiers, readers, silent_deletion]
    - layer_id: '07c:layer:p2-semantic-adjudication-candidate'
      ordinal: P2
      name: Semantic Adjudication Candidate
      consumes: ['07c:layer:p1-prepared-evidence', business_skeleton_candidate, gold_constraints]
      outputs: [object_anchor_candidates, expression_ownership_candidates, field_attribute_candidates, qualifier_candidates, counterevidence, next_evidence]
      prohibits: [candidate_as_decision, token_as_concept, table_vote, reader_publication]
    - layer_id: '07c:layer:p3-semantic-decision'
      ordinal: P3
      name: Semantic Decision
      consumes: ['07c:layer:p2-semantic-adjudication-candidate', locatable_evidence, semantic_adjudication]
      outputs: [accepted_or_rejected_concept_identity, accepted_expression, accepted_field_attribute, accepted_qualifier, deferred_decision]
      prohibits: [evidence_rewrite, score_as_probability, inherited_expression_support]
    - layer_id: '07c:layer:p4-reader-candidate'
      ordinal: P4
      name: Reader Candidate
      consumes: ['07c:layer:p3-semantic-decision', visible_blockers]
      outputs: [unique_reader_identity, entry_refs, expression_set, physical_implementations, expression_support, publication_blockers]
      prohibits: [combined_order_trade_identity, duplicated_reader_identity, configuration_seed_as_evidence, published_claim]
    - layer_id: '07c:layer:p5-reader-projection'
      ordinal: P5
      name: Reader Projection
      consumes: ['07c:layer:p4-reader-candidate', p0_to_p3_refs, frozen_projection_bundle]
      outputs: [single_page_navigation, expression_matrix, physical_details, evidence_and_conflicts, governance_queue, count_denominators]
      prohibits: [independent_source_of_truth, canonical_write_back, hidden_unknowns, business_acceptance_claim]

business_topology:
  topology_id: '07c:topology:otc-navigation-compressed'
  universal_sequence: false
  page_level_group_count: 4
  groups:
    - group_kind: JOURNEY_ENTRIES
      label_zh: 旅程入口
      nodes:
        - {topology_node_id: 'journey:trade-preparation', label_zh: 交易准备}
        - {topology_node_id: 'journey:inquiry-quote-order', label_zh: 询价、报价与订单}
        - {topology_node_id: 'journey:execution-trade-formation', label_zh: 执行与交易形成}
        - {topology_node_id: 'journey:contract-formation', label_zh: 合同形成}
    - group_kind: CONTRACT_EXISTENCE_DOMAIN
      label_zh: 合同存续域
      nodes:
        - topology_node_id: 'envelope:contract-existence'
          label_zh: 合同存续域
          serial_stage: false
    - group_kind: REPEATING_BUSINESS_ACTIVITIES
      label_zh: 可重复业务活动
      cardinality: ZERO_OR_MANY
      nodes:
        - {topology_node_id: 'activity:lifecycle-events', label_zh: 生命周期事件}
        - {topology_node_id: 'activity:valuation-risk', label_zh: 估值与风险}
        - {topology_node_id: 'activity:margin-collateral', label_zh: 保证金与抵押品}
        - topology_node_id: 'activity:obligation-cashflow-group'
          label_zh: 义务与现金流计算
          grouping_only: true
          distinct_concept_refs: ['concept:settlement-obligation', 'concept:cash-flow']
          concept_identity_merge: false
        - {topology_node_id: 'activity:clearing', label_zh: 清算}
        - {topology_node_id: 'activity:payment-transfer-delivery', label_zh: 支付、转移与交割}
        - {topology_node_id: 'activity:settlement-result', label_zh: 结算结果}
    - group_kind: CROSSCUTTING_SUPPORT
      label_zh: 横切支撑面
      nodes:
        - {topology_node_id: 'crosscut:market-reference-business-configuration', label_zh: 市场参考与业务配置}
        - {topology_node_id: 'crosscut:operations-reconciliation-reporting', label_zh: 运营、对账与报表}
        - {topology_node_id: 'crosscut:technical-processing-audit', label_zh: 技术加工与审计}
  relationship_rules:
    - Journey edges are candidate precedes-or-produces relations, not a universal lifecycle.
    - Repeating activities may branch, overlap, repeat, or re-enter while the contract exists.
    - Operations, reconciliation, reporting, technical processing, and audit remain crosscutting.
    - Multiple entry paths resolve to one Reader identity.
    - Obligation plus cash-flow is a page grouping only; obligation, cash-flow schedule/item, fulfillment event, and settlement result remain separate identities.

business_areas:
  - area_id: 'area:parties-relations'
    label_zh: 参与主体与关系
    projection_group: JOURNEY_ENTRIES
    reader_refs: ['reader:counterparty']
    boundary: Customer and Counterparty are relations and are not synonyms by default.
  - area_id: 'area:products-underlyings'
    label_zh: 产品与标的
    projection_group: JOURNEY_ENTRIES
    reader_refs: []
    boundary: Product, Underlying, and Trade Contract remain distinct.
  - area_id: 'area:inquiry-quote-order-trade'
    label_zh: 询价、报价、订单与交易
    projection_group: JOURNEY_ENTRIES
    reader_refs: ['reader:order', 'reader:trade']
    boundary: Order and Trade have separate identities.
  - area_id: 'area:agreements-contracts-terms'
    label_zh: 协议、合同与条款
    projection_group: CONTRACT_EXISTENCE_DOMAIN
    reader_refs: ['reader:notional']
    boundary: Agreement, Trade Contract, Contract Leg, and Economic Terms remain layered candidates.
  - area_id: 'area:lifecycle-events'
    label_zh: 生命周期事件
    projection_group: REPEATING_BUSINESS_ACTIVITIES
    reader_refs: []
    boundary: Event is not a time qualifier or technical task state.
  - area_id: 'area:positions-risk'
    label_zh: 持仓、头寸与风险
    projection_group: REPEATING_BUSINESS_ACTIVITIES
    reader_refs: ['reader:position']
    boundary: Position is not Position View or Risk Exposure by default.
  - area_id: 'area:valuation'
    label_zh: 估值
    projection_group: REPEATING_BUSINESS_ACTIVITIES
    reader_refs: []
    boundary: Valuation process is not its input, output, Margin, or Risk Exposure.
  - area_id: 'area:margin-collateral'
    label_zh: 保证金与抵押品
    projection_group: REPEATING_BUSINESS_ACTIVITIES
    reader_refs: ['reader:margin']
    boundary: Margin requirement or measure is not Collateral asset.
  - area_id: 'area:cashflow-clearing-settlement'
    label_zh: 现金流、清算与结算
    projection_group: REPEATING_BUSINESS_ACTIVITIES
    reader_refs: []
    boundary: Cash Flow, obligation, clearing, fulfillment, delivery, and result remain distinct.
  - area_id: 'area:market-reference'
    label_zh: 市场参考
    projection_group: CROSSCUTTING_SUPPORT
    reader_refs: []
    boundary: Reference source is not data flow side or valuation result.
  - area_id: 'area:business-configuration'
    label_zh: 业务配置与控制
    projection_group: CROSSCUTTING_SUPPORT
    reader_refs: []
    boundary: Generic type or flag and technical configuration are excluded.
  - area_id: 'area:operations-reconciliation-reporting'
    label_zh: 运营、对账与报表
    projection_group: CROSSCUTTING_SUPPORT
    reader_refs: []
    boundary: Crosscutting operations cannot vote a business identity into existence.
  - area_id: 'area:technical-processing-audit'
    label_zh: 技术加工与审计
    projection_group: CROSSCUTTING_SUPPORT
    reader_refs: []
    boundary: Technical candidates remain visible and do not enter business Readers automatically.

concept_registry:
  registry_id: '07c:registry:business-concepts'
  core_count: 22
  supporting_count_not_in_core: 3
  concepts:
    - concept_id: 'concept:customer'
      label_zh: 客户
      type: RELATION
      stable_definition: 与本机构存在服务、准入或账户关系的 Party-in-relation。
      excludes: [Counterparty by default, Party master identity]
      status: DEFERRED
    - concept_id: 'concept:counterparty'
      label_zh: 交易对手
      type: RELATION
      stable_definition: 在协议、订单或交易关系中承担对手方关系的 Party-in-relation。
      excludes: [Customer by default, SOURCE or TARGET, SHORT or LONG name form]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:product'
      label_zh: 产品
      type: OBJECT
      stable_definition: 定义可交易经济结构和规则的产品类别或实例。
      excludes: [Trade Contract, Underlying, generic type]
      status: DEFERRED
    - concept_id: 'concept:underlying'
      label_zh: 标的
      type: OBJECT
      stable_definition: 决定衍生价值或交付内容的资产、指数或参考项。
      excludes: [Product, market value, Valuation result]
      status: DEFERRED
    - concept_id: 'concept:inquiry'
      label_zh: 询价
      type: EVENT
      stable_definition: 发起获取可交易条件的信息请求。
      excludes: [Quote, Order, Trade]
      status: DEFERRED
    - concept_id: 'concept:quote'
      label_zh: 报价
      type: OBJECT
      stable_definition: 针对询价或交易意图给出的价格和条款提议。
      excludes: [Order, Trade, Valuation]
      status: DEFERRED
    - concept_id: 'concept:order'
      label_zh: 订单
      type: OBJECT
      stable_definition: 指示拟执行交易的意图或指令，可撤销、拒绝或未成交。
      excludes: [Trade, Trade Contract]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:trade'
      label_zh: 交易
      type: OBJECT
      stable_definition: 已经执行并形成经济事实的交易记录。
      excludes: [Order, Trade Contract]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:trade-contract'
      label_zh: 合约
      type: OBJECT
      stable_definition: 合同形成后承载一笔或一组交易权利义务的合同身份。
      excludes: [Agreement, Trade, Economic Terms collection]
      status: DEFERRED
    - concept_id: 'concept:contract-leg'
      label_zh: 合约腿
      type: OBJECT
      stable_definition: 合约中具有独立付款、标的或计算安排的组成部分。
      excludes: [Notional, leg identifier as concept]
      status: DEFERRED
    - concept_id: 'concept:economic-terms'
      label_zh: 经济条款
      type: CONTROL
      stable_definition: 约束合同或合约腿经济结果的数值和条件集合。
      excludes: [Trade Contract legal identity, Lifecycle Event]
      status: DEFERRED
    - concept_id: 'concept:position'
      label_zh: 持仓
      type: OBJECT
      stable_definition: 某主体、账户或组合在指定时点与业务范围下的持有状态记录。
      independent_expressions: [quantity, balance, direction, observation_time]
      excludes: [Order quantity, quantity-only identity, technical sync count, Risk Exposure]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:position-view'
      label_zh: 头寸
      type: MEASURE
      stable_definition: 对持仓按账户、组合、方向或净额口径形成的业务视图或度量。
      excludes: [Position by default, Risk Exposure]
      status: DEFERRED
    - concept_id: 'concept:notional'
      label_zh: 名义本金
      type: MEASURE
      stable_definition: 用于计算现金流、风险或条款规模的合同度量基准。
      excludes: [Position, Margin, Valuation, Payment Amount]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:valuation'
      label_zh: 估值
      type: PROCESS
      stable_definition: 在给定时点和方法下计算合同或持仓价值的过程。
      excludes: [price input, Risk Exposure, Margin]
      status: DEFERRED
    - concept_id: 'concept:risk-exposure'
      label_zh: 风险敞口
      type: MEASURE
      stable_definition: 基于风险方法、情景或净额计算的潜在损失或敏感度度量。
      excludes: [Position, Notional]
      status: DEFERRED
    - concept_id: 'concept:margin'
      label_zh: 保证金
      type: MEASURE
      stable_definition: 为覆盖履约风险而计算、要求或记录的保证金额度或状态。
      excludes: [Collateral asset, Valuation, generic amount]
      status: REWORKED_CANDIDATE
    - concept_id: 'concept:collateral'
      label_zh: 抵押品
      type: OBJECT
      stable_definition: 为满足保证金或信用支持义务而提供、占用或释放的资产。
      excludes: [Margin amount, Notional]
      status: DEFERRED
    - concept_id: 'concept:cash-flow'
      label_zh: 现金流
      type: OBJECT
      stable_definition: 由合同条款或事件计算出的计划收付日程或明细表达。
      excludes: [Receivable or payable obligation identity, Payment event, Transfer event, Delivery event, Settlement Result]
      status: DEFERRED
    - concept_id: 'concept:delivery'
      label_zh: 交割
      type: EVENT
      stable_definition: 按义务交付约定资产或标的的履行动作。
      excludes: [Clearing, Settlement Result]
      status: DEFERRED
    - concept_id: 'concept:clearing'
      label_zh: 清算
      type: PROCESS
      stable_definition: 对交易义务进行确认、匹配、净额化或形成结算指令的过程。
      excludes: [Payment, Delivery, Settlement Result]
      status: DEFERRED
    - concept_id: 'concept:settlement-result'
      label_zh: 结算结果
      type: OBJECT
      stable_definition: 记录结算义务履行成功、失败、部分完成或待处理的结果。
      excludes: [Cash Flow, Settlement Obligation, technical task status]
      status: DEFERRED
  supporting_identities_not_in_core:
    - concept_id: 'concept:agreement'
      label_zh: 协议
      type: OBJECT
      purpose: Distinguish legal or master agreement from Trade Contract.
      status: DEFERRED
    - concept_id: 'concept:settlement-obligation'
      label_zh: 结算义务
      type: OBJECT
      purpose: Represent payable or receivable responsibility independently from a calculated cash-flow schedule or item, fulfillment event, and result.
      status: DEFERRED
    - concept_id: 'concept:payment-transfer'
      label_zh: 支付或转移
      type: EVENT
      purpose: Distinguish movement event from Delivery and Settlement Result.
      status: DEFERRED
  obligation_cashflow_settlement_boundary:
    layers:
      - {layer: OBLIGATION, concept_ref: 'concept:settlement-obligation', meaning: payable_or_receivable_responsibility}
      - {layer: CASH_FLOW_SCHEDULE_OR_ITEM, concept_ref: 'concept:cash-flow', meaning: calculated_or_planned_expression}
      - {layer: FULFILLMENT_EVENT, concept_refs: ['concept:payment-transfer', 'concept:delivery'], meaning: payment_transfer_or_delivery_occurrence}
      - {layer: SETTLEMENT_RESULT, concept_ref: 'concept:settlement-result', meaning: success_failure_partial_or_pending_result}
    boundary_counterexample:
      observation: Planned payment amount and due date exist.
      allowed_inference: CASH_FLOW_SCHEDULE_OR_ITEM_WITH_POSSIBLE_OBLIGATION_CONTEXT
      prohibited_inferences: [PAYMENT_OCCURRED, DELIVERY_OCCURRED, SETTLEMENT_SUCCEEDED]

field_attribute_registry:
  registry_id: '07c:registry:field-attributes'
  attributes:
    - attribute_id: IDENTIFIER
      definition: 在已裁定业务对象语境内标识实例。
      prohibits: [bare identifier token, technical identifier promotion]
    - attribute_id: DESCRIPTIVE_TEXT
      definition: 名称、简称、描述和备注等可读表达。
      prohibits: [name length as position side, abbreviation as concept]
    - attribute_id: PARTY_RELATIONSHIP
      definition: Party 与机构、协议、订单或交易之间的已裁定关系。
      prohibits: [trade side, flow side, position side]
    - attribute_id: BUSINESS_OBJECT_STATE
      definition: 命名所属业务对象命名空间的状态属性。
      prohibits: [bare state, technical job state, cross-object state merge]
    - attribute_id: MEASURE
      definition: 明确业务概念所有权下的数量、金额、比率或其他度量。
      prohibits: [bare amount or quantity as concept]
    - attribute_id: CURRENCY
      definition: 币种 identity 或某度量的币种表达。
      prohibits: [bare currency as concept, data source]
    - attribute_id: TIME
      definition: 业务日期、时点、区间或期限。
      prohibits: [audit timestamps without business-time decision]
    - attribute_id: AUDIT
      definition: 经规则与 Gold 验证后的审计和处理追踪属性，仅进入技术投影。
      prohibits: [automatic business Reader membership]

qualifier_registry:
  registry_id: '07c:registry:qualifiers'
  qualifiers:
    - qualifier_id: observation_time_role
      values: [INITIAL, CURRENT, END, BEFORE_ADJUSTMENT, AFTER_ADJUSTMENT]
      requires: [business_time_expression, object_applicability]
    - qualifier_id: position_side
      values: [LONG, SHORT]
      requires: [position_or_applicable_measure_context, independent_direction_evidence]
    - qualifier_id: trade_side
      values: [BUY, SELL]
      requires: [trade_or_order_context, explicit_buy_sell_evidence]
    - qualifier_id: cashflow_direction
      values: [PAY, RECEIVE]
      requires: [cashflow_or_margin_payment_context, value_semantics]
    - qualifier_id: currency_basis
      values: [ORIGINAL_CURRENCY, LOCAL_CURRENCY, UNDERLYING_CURRENCY, SETTLEMENT_CURRENCY]
      requires: [measure_expression, explicit_currency_basis_evidence]
    - qualifier_id: party_relationship_role
      values: [CUSTOMER, COUNTERPARTY, INTERNAL_PARTY, EXTERNAL_PARTY]
      requires: [adjudicated_party_relation]
    - qualifier_id: variability
      values: [DYNAMIC, FIXED]
      requires: [applicable_term_or_measure]
    - qualifier_id: aggregation_state
      values: [ACCUMULATED, NET, GROSS]
      requires: [explicit_aggregation_semantics]
    - qualifier_id: availability_condition
      values: [AVAILABLE, FROZEN]
      requires: [business_availability_semantics]
    - qualifier_id: estimation_status
      values: [ESTIMATED, OBSERVED]
      requires: [measurement_provenance]
    - qualifier_id: measure_basis
      values: [ABSOLUTE, RATIO, PERCENTAGE]
      requires: [measure_expression, explicit_basis_semantics]
    - qualifier_id: flow_side
      values: [SOURCE, TARGET]
      portability: TRADEFLOW_ONLY
      requires: [explicit_mapping_input_or_output_context, semantic_decision]
  p2_to_p3_formal_promotion_gate:
    direction: P2_TO_P3_ONLY
    checks:
      - object applicability checked
      - Chinese comment or independent context present
      - blocking conflict absent or adjudicated in the P3 decision record
      - dimension compatible with expression
      - applicable Gold expectation satisfied
      - P3 semantic decision recorded
    p2_feedback_allowed: false

observation_to_semantic_mappings:
  mapping_set_id: '07c:mappings:observation-to-semantic-candidates'
  mappings:
    - mapping_id: '07c:mapping:identifier-shape'
      input_block: generic_attribute_observations
      observation: IDENTIFIER_SHAPE
      additional_conditions: [single_bounded_business_object_anchor_candidate, no_identity_blocking_conflict]
      output: IDENTIFIER_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:numeric-shape'
      input_block: generic_attribute_observations
      observation: NUMERIC_SHAPE
      additional_conditions: [none]
      output: REQUIRED_NEXT_EVIDENCE_FOR_MEASURE_SEMANTICS
      semantic_resolution_status: UNBOUND
      maximum_layer: P2
    - mapping_id: '07c:mapping:code-shape'
      input_block: generic_attribute_observations
      observation: CODE_SHAPE
      additional_conditions: [bounded_owning_object_candidate, explicit_code_role_evidence]
      output: IDENTIFIER_OR_DESCRIPTIVE_TEXT_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:name-variant'
      input_block: generic_attribute_observations
      observation: NAME_VARIANT_OBSERVATION
      additional_conditions: [single_bounded_owning_business_object_candidate]
      output: DESCRIPTIVE_TEXT_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:business-object-state'
      input_block: generic_attribute_observations
      observation: BUSINESS_OBJECT_STATE
      additional_conditions: [bounded_object_namespace_candidate, nontechnical_state_evidence]
      output: BUSINESS_OBJECT_STATE_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:classification'
      input_block: generic_attribute_observations
      observation: CLASSIFICATION
      additional_conditions: [bounded_owning_object_candidate, classification_semantics_present]
      output: DESCRIPTIVE_TEXT_OR_DEFERRED_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:measure'
      input_block: generic_attribute_observations
      observation: MEASURE
      additional_conditions: [bounded_business_concept_candidate, measure_semantic_evidence]
      output: MEASURE_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:quantity'
      input_block: generic_attribute_observations
      observation: QUANTITY
      additional_conditions: [bounded_business_concept_candidate, quantity_or_balance_interpretations_retained]
      output: MEASURE_OR_CONFLICT_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:rate'
      input_block: generic_attribute_observations
      observation: RATE
      additional_conditions: [bounded_business_concept_candidate, explicit_rate_or_ratio_semantics]
      output: MEASURE_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:time'
      input_block: generic_attribute_observations
      observation: TIME
      additional_conditions: [business_time_role_candidate, not_technical_audit_time]
      output: TIME_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:currency'
      input_block: generic_attribute_observations
      observation: CURRENCY
      additional_conditions: [currency_identity_or_measure_basis_evidence, bounded_owning_expression_candidate]
      output: CURRENCY_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:description'
      input_block: generic_attribute_observations
      observation: DESCRIPTION
      additional_conditions: [single_bounded_owning_business_object_candidate]
      output: DESCRIPTIVE_TEXT_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:source-target'
      input_block: generic_attribute_observations
      observation: SOURCE_TARGET_TERM
      profile_guard: {profile_ref_exact: TITANS_TRADEFLOW, schema_name_exact: TITANS_TRADEFLOW}
      additional_conditions: [active_profile_is_TITANS_TRADEFLOW, active_schema_is_TITANS_TRADEFLOW, mapping_context, input_output_responsibility_evidence]
      output: FLOW_SIDE_OR_LINEAGE_CANDIDATE
      non_tradeflow_output: LINEAGE_CONTEXT_ONLY_NO_FLOW_SIDE_CANDIDATE
      required_negative_case_ref: NON-TF-SOURCE-TARGET-001
      maximum_layer: P2
    - mapping_id: '07c:mapping:abbreviation-candidate-context'
      input_block: abbreviation_observations
      selector: {status: CANDIDATE}
      additional_conditions: [expansion_candidate_is_not_null, versioned_expansion_rule, corroborating_non_abbreviation_observation]
      output: CONTEXT_ONLY_FOR_EXISTING_P2_CANDIDATE
      sole_source_output: NO_SEMANTIC_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:abbreviation-unrecognized'
      input_block: abbreviation_observations
      selector: {status: UNRECOGNIZED_ABBREVIATION}
      output: REQUIRED_NEXT_EVIDENCE
      semantic_resolution_status: DEFERRED
      maximum_layer: P2
    - mapping_id: '07c:mapping:qualifier-position-side'
      input_block: candidate_qualifier_observations
      selector: {dimension: position_side, value: [LONG, SHORT], status: [CANDIDATE, CONFLICT]}
      additional_condition_set_ref: '07c:checkset:p1-to-p2-qualifier-candidate'
      output: POSITION_SIDE_CANDIDATE
      open_conflict_status: CONFLICT
      maximum_layer: P2
    - mapping_id: '07c:mapping:qualifier-trade-side'
      input_block: candidate_qualifier_observations
      selector: {dimension: trade_side, value: [BUY, SELL], status: [CANDIDATE, CONFLICT]}
      additional_condition_set_ref: '07c:checkset:p1-to-p2-qualifier-candidate'
      output: TRADE_SIDE_CANDIDATE
      open_conflict_status: CONFLICT
      maximum_layer: P2
    - mapping_id: '07c:mapping:qualifier-cashflow-direction'
      input_block: candidate_qualifier_observations
      selector: {dimension: cashflow_direction, value: [PAY, RECEIVE], status: [CANDIDATE, CONFLICT]}
      additional_condition_set_ref: '07c:checkset:p1-to-p2-qualifier-candidate'
      output: CASHFLOW_DIRECTION_CANDIDATE
      open_conflict_status: CONFLICT
      maximum_layer: P2
    - mapping_id: '07c:mapping:qualifier-variability'
      input_block: candidate_qualifier_observations
      selector: {dimension: variability, value: [DYNAMIC, FIXED], status: [CANDIDATE, CONFLICT]}
      additional_condition_set_ref: '07c:checkset:p1-to-p2-qualifier-candidate'
      output: VARIABILITY_CANDIDATE
      open_conflict_status: CONFLICT
      maximum_layer: P2
    - mapping_id: '07c:mapping:qualifier-currency-basis'
      input_block: candidate_qualifier_observations
      selector:
        dimension: currency_basis
        value: [ORIGINAL_CURRENCY, LOCAL_CURRENCY, UNDERLYING_CURRENCY, SETTLEMENT_CURRENCY]
        status: [CANDIDATE, CONFLICT]
      additional_condition_set_ref: '07c:checkset:p1-to-p2-qualifier-candidate'
      output: CURRENCY_BASIS_CANDIDATE
      open_conflict_status: CONFLICT
      maximum_layer: P2
    - mapping_id: '07c:mapping:technical-observation'
      input_block: technical_observations
      selector:
        technical_class: [TECHNICAL_IDENTIFIER, AUDIT_ACTOR, AUDIT_TIME, INGESTION_METADATA, BATCH_METADATA, LINEAGE_METADATA, EXTENSION_SLOT, SOFT_DELETE, VERSION_CONTROL, UNRESOLVED_TECHNICAL]
        status: [CANDIDATE, UNRESOLVED]
      additional_conditions: [rule_execution_completed, suite_a_expectation_met]
      output: TECHNICAL_PROJECTION_CANDIDATE
      maximum_layer: P2
  composite_field_attribute_mappings:
    - mapping_id: '07c:mapping:semantic-field-attribute-party-relationship'
      input_blocks: [generic_attribute_observations, abbreviation_observations, raw_physical_fact, contextual_evidence, conflicts]
      additional_conditions: [bounded_party_relation_object_candidate, explicit_relationship_role_evidence, independent_comment_or_context]
      output: {collection: field_attribute_candidates, field_attribute: PARTY_RELATIONSHIP}
      abbreviation_or_token_only_output: NO_FIELD_ATTRIBUTE_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-field-attribute-audit'
      input_blocks: [technical_observations, raw_physical_fact, contextual_evidence, provenance, conflicts]
      additional_conditions: [provider_rule_execution_completed, applicable_suite_a_expectation_met, explicit_audit_responsibility_evidence]
      output: {collection: field_attribute_candidates, field_attribute: AUDIT, projection_route: TECHNICAL_ONLY}
      pre_validation_output: TECHNICAL_CANDIDATE_ONLY
      business_reader_eligibility: false
      maximum_layer: P2
  composite_qualifier_mappings:
    - mapping_id: '07c:mapping:semantic-qualifier-observation-time-role'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_requirements:
        bounded_owning_expression_candidate: REQUIRED
        one_of: [TIME_CANDIDATE, MEASURE_CANDIDATE]
      additional_conditions: [explicit_initial_current_end_or_adjustment_time_semantics, nontechnical_time_role, independent_comment_or_context]
      output: {collection: qualifier_candidates, dimension: observation_time_role, allowed_values: [INITIAL, CURRENT, END, BEFORE_ADJUSTMENT, AFTER_ADJUSTMENT]}
      bare_time_observation_output: NO_QUALIFIER_CANDIDATE
      required_case_reachability: [K01]
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-party-relationship-role'
      input_blocks: [generic_attribute_observations, abbreviation_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_refs: [bounded_party_relation_object_candidate, 'field_attribute_candidate:PARTY_RELATIONSHIP']
      additional_conditions: [explicit_relationship_role_evidence, independent_comment_or_context, customer_counterparty_conflict_retained]
      output: {collection: qualifier_candidates, dimension: party_relationship_role, allowed_values: [CUSTOMER, COUNTERPARTY, INTERNAL_PARTY, EXTERNAL_PARTY]}
      abbreviation_only_output: NO_QUALIFIER_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-aggregation-state'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_refs: [MEASURE_CANDIDATE, bounded_owning_expression_candidate]
      additional_conditions: [explicit_accumulated_net_or_gross_semantics, independent_comment_or_context]
      output: {collection: qualifier_candidates, dimension: aggregation_state, allowed_values: [ACCUMULATED, NET, GROSS]}
      bare_numeric_observation_output: NO_QUALIFIER_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-availability-condition'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_refs: [BUSINESS_OBJECT_STATE_CANDIDATE, bounded_owning_expression_candidate]
      additional_conditions: [explicit_available_or_frozen_business_semantics, nontechnical_state_evidence]
      output: {collection: qualifier_candidates, dimension: availability_condition, allowed_values: [AVAILABLE, FROZEN]}
      bare_state_observation_output: NO_QUALIFIER_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-estimation-status'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, provenance, conflicts]
      base_candidate_refs: [MEASURE_CANDIDATE, bounded_owning_expression_candidate]
      additional_conditions: [explicit_estimated_or_observed_measurement_semantics, measurement_provenance]
      output: {collection: qualifier_candidates, dimension: estimation_status, allowed_values: [ESTIMATED, OBSERVED]}
      inference_from_missing_provenance_output: NO_QUALIFIER_CANDIDATE
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-measure-basis'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_refs: [MEASURE_CANDIDATE, bounded_owning_expression_candidate]
      additional_conditions: [explicit_absolute_ratio_or_percentage_semantics, numeric_or_unit_evidence, independent_comment_or_context]
      output: {collection: qualifier_candidates, dimension: measure_basis, allowed_values: [ABSOLUTE, RATIO, PERCENTAGE]}
      bare_rate_or_numeric_observation_output: NO_QUALIFIER_CANDIDATE
      required_case_reachability: [C03]
      maximum_layer: P2
    - mapping_id: '07c:mapping:semantic-qualifier-flow-side'
      input_blocks: [generic_attribute_observations, raw_physical_fact, contextual_evidence, conflicts]
      base_candidate_refs: [FLOW_SIDE_OR_LINEAGE_CANDIDATE, bounded_mapping_expression_candidate]
      profile_guard: {profile_ref_exact: TITANS_TRADEFLOW, schema_name_exact: TITANS_TRADEFLOW}
      additional_conditions: [explicit_mapping_input_or_output_responsibility, active_profile_is_TITANS_TRADEFLOW, active_schema_is_TITANS_TRADEFLOW, independent_context]
      output: {collection: qualifier_candidates, dimension: flow_side, allowed_values: [SOURCE, TARGET], portability: TRADEFLOW_ONLY}
      bare_source_or_target_output: LINEAGE_CONTEXT_ONLY_NO_QUALIFIER_CANDIDATE
      non_tradeflow_output: LINEAGE_CONTEXT_ONLY_NO_QUALIFIER_CANDIDATE
      required_negative_case_ref: NON-TF-SOURCE-TARGET-001
      maximum_layer: P2
  exhaustiveness:
    all_16_provider_blocks_have_routes: true
    all_13_generic_attribute_values_have_explicit_routes: true
    both_generic_attribute_status_values_have_explicit_routes: true
    both_abbreviation_status_values_have_explicit_routes: true
    all_10_technical_classes_and_both_status_values_have_explicit_routes: true
    all_5_candidate_qualifier_dimensions_have_explicit_routes: true
    both_semantic_only_field_attributes_have_explicit_composite_routes: true
    all_8_canonical_field_attributes_are_reachable_at_p2: true
    all_7_semantic_only_qualifier_dimensions_have_explicit_composite_routes: true
    all_12_canonical_qualifier_dimensions_are_reachable_at_p2: true
    undefined_observation_names_allowed: false
    p3_dependency_in_p1_to_p2_mapping_allowed: false
    static_route_presence_is_not_behavioral_coverage: true
  behavioral_route_coverage_contract:
    field_attribute_refs_exact: [IDENTIFIER, DESCRIPTIVE_TEXT, PARTY_RELATIONSHIP, BUSINESS_OBJECT_STATE, MEASURE, CURRENCY, TIME, AUDIT]
    qualifier_refs_exact: [observation_time_role, position_side, trade_side, cashflow_direction, currency_basis, party_relationship_role, variability, aggregation_state, availability_condition, estimation_status, measure_basis, flow_side]
    required_behavior_classes:
      - PROMOTABLE_WITH_REQUIRED_EVIDENCE
      - INSUFFICIENT_OR_UNBOUND
      - MISLEADING_OR_CONFLICT_OR_EXPLICIT_NOT_APPLICABLE
    concrete_matrix_ref: 07-integrated-validation-plan.yaml#behavioral_route_matrix
    execution_gate:
      exact_dimension_sets_required: true
      every_behavior_class_nonempty_or_explicit_not_applicable: true
      zero_omission_required: true
      unexecuted_counts_as_pass: false
      empty_match_set_counts_as_pass: false
      static_route_declaration_counts_as_pass: false
      failure_effect: STOP_BEFORE_SUITE_B_EXECUTION

prohibited_auto_mappings:
  registry_id: '07c:registry:prohibited-auto-mappings'
  prohibitions:
    - prohibition_id: '07c:prohibit:token-to-concept'
      rule: A token cannot create a business concept identity.
    - prohibition_id: '07c:prohibit:token-to-qualifier'
      rule: A token cannot create a formal qualifier.
    - prohibition_id: '07c:prohibit:token-to-reader'
      rule: A token cannot create or publish a Reader.
    - prohibition_id: '07c:prohibit:short-long-name-to-position-side'
      rule: SHORT_NAME and LONG_NAME cannot create position_side.
    - prohibition_id: '07c:prohibit:source-target-to-flow-side'
      rule: SOURCE or TARGET cannot create flow_side without explicit mapping semantics and P3 decision.
    - prohibition_id: '07c:prohibit:identifier-without-object'
      rule: IDENTIFIER_SHAPE without an object anchor cannot become an IDENTIFIER decision.
    - prohibition_id: '07c:prohibit:technical-to-audit-decision'
      rule: A technical candidate cannot become AUDIT or be removed before rule execution and validation.
    - prohibition_id: '07c:prohibit:table-name-vote'
      rule: Table or object name cannot decide field meaning.
    - prohibition_id: '07c:prohibit:wiki-context-decision'
      rule: Wiki title or path remains weak context and cannot decide a concept or relation.
    - prohibition_id: '07c:prohibit:same-name-merge'
      rule: Equal field names in different objects retain different physical identities.
    - prohibition_id: '07c:prohibit:order-trade-inheritance'
      rule: Order and Trade cannot inherit each other's identifiers or Reader identity.
    - prohibition_id: '07c:prohibit:reader-wide-support-inheritance'
      rule: Support is computed per Reader expression and cannot be inherited from another expression or source concept.

reader_contracts:
  registry_id: '07c:registry:first-reader-contracts'
  common_current_status:
    reader_status: REWORKED_CANDIDATE
    publication_status: BLOCKED_PENDING_INTEGRATION
  common_publication_gate:
    - Versioned Provider and complete 13,611-field Evidence Pack exist.
    - Suite A rule execution has been performed and decisive failures reviewed.
    - P1-to-P2 handoff is schema-valid and produces candidates only.
    - Reader has at least one direct positive case and one misleading-name or boundary counterexample.
    - Suite B and Suite C decisive expectations are met or explicitly NOT_EVALUABLE.
    - No identity-critical, definition-critical, or qualifier-critical conflict remains open.
    - Every expression computes its own evidence and publication state.
    - Physical implementations trace to P0 and P1 by physical_column_id.
    - Configuration-seed entries remain non-evidence until separately supported.
    - Independent review is required before publication and cannot be replaced by this contract.
  readers:
    - reader_id: 'reader:counterparty'
      concept_ref: 'concept:counterparty'
      reader_status: REWORKED_CANDIDATE
      publication_status: BLOCKED_PENDING_INTEGRATION
      stable_definition: 在协议、订单或交易关系中承担对手方关系的 Party-in-relation。
      exclusions: [Customer by default, Party master identity, name-length direction, naked source-target flow]
      allowed_field_attributes: [IDENTIFIER, DESCRIPTIVE_TEXT, PARTY_RELATIONSHIP, BUSINESS_OBJECT_STATE, TIME]
      allowed_qualifiers: [party_relationship_role, trade_side, flow_side]
      qualifier_constraints:
        flow_side: TRADEFLOW-only; explicit mapping input-output responsibility and a P3 decision are mandatory.
      allowed_entry_refs: ['entry:counterparty:trade-preparation', 'entry:counterparty:trade-formation']
      required_gold_refs:
        suite_a: [FEP-001, FEP-002, FEP-003, FEP-005, FEP-006, FEP-019, FEP-020, FEP-021, FEP-022, FEP-023]
        suite_b: [A01, A02, A03, A04, A05, B01, D01, D02, G01, I01, I02, L01]
        suite_c: [CXL-001, CXL-003, CXL-005, CXL-006, CXL-010]
      blocking_cases: [A03, D01, D02]
      minimum_physical_evidence: [canonical_anchor, separate_name_and_comment_evidence, object_context, dual_artifact_provenance]
      conflict_blocking_rules: [competing_party_anchor_blocks_reader, name_direction_conflict_blocks_expression, mapping_role_conflict_blocks_flow_side]
      publication_gate: [COMMON_PUBLICATION_GATE, A03_OBJECT_IDENTITY_RESOLVED, MAPPING_ROLE_ADJUDICATED, NO_NAME_DIRECTION_LEAK]
      current_blockers: [FIELD_EVIDENCE_NOT_IMPLEMENTED, A03_UNRESOLVED, MAPPING_ROLE_UNRESOLVED, GOLD_PENDING]
    - reader_id: 'reader:order'
      concept_ref: 'concept:order'
      reader_status: REWORKED_CANDIDATE
      publication_status: BLOCKED_PENDING_INTEGRATION
      stable_definition: 指示拟执行交易的意图或指令，可撤销、拒绝或未成交。
      exclusions: [Trade, Trade Contract, Trade identifier inheritance]
      allowed_field_attributes: [IDENTIFIER, DESCRIPTIVE_TEXT, PARTY_RELATIONSHIP, BUSINESS_OBJECT_STATE, MEASURE, CURRENCY, TIME]
      allowed_qualifiers: [trade_side, observation_time_role, currency_basis, aggregation_state]
      allowed_entry_refs: ['entry:order:order-intent']
      required_gold_refs:
        suite_a: [FEP-017]
        suite_b: [G02, H01]
        suite_c: [CXL-004, CXL-007]
      blocking_cases: [G02, H01]
      minimum_physical_evidence: [order_specific_anchor, explicit_order_responsibility, distinction_from_trade]
      conflict_blocking_rules: [order_trade_identity_conflict_blocks_reader, table_name_only_blocks_expression]
      publication_gate: [COMMON_PUBLICATION_GATE, ORDER_TRADE_IDENTITIES_SEPARATE, ORDER_DIRECT_POSITIVE_PRESENT]
      current_blockers: [FIELD_EVIDENCE_NOT_IMPLEMENTED, MERGED_RUNTIME_READER, GOLD_PENDING]
    - reader_id: 'reader:trade'
      concept_ref: 'concept:trade'
      reader_status: REWORKED_CANDIDATE
      publication_status: BLOCKED_PENDING_INTEGRATION
      stable_definition: 已经执行并形成经济事实的交易记录。
      exclusions: [Order, Trade Contract, Order identifier inheritance]
