canonical_physical_identity:
  interface_id: '07c:interface:physical-identity'
  record_name: CanonicalPhysicalIdentity
  fields:
    - field_name: run_id
      type: string
      required: true
      role: RUNTIME_SCOPE_NOT_SEMANTIC_DECLARATION
    - field_name: profile_ref
      type: string
      required: true
      role: PROFILE_SCOPE
    - field_name: schema_name
      type: string
      required: true
      source: objects.json.schema_name
    - field_name: object_name
      type: string
      required: true
      source: objects.json.object_name
    - field_name: object_type
      type: enum
      required: true
      allowed_values: [TABLE, VIEW, MATERIALIZED_VIEW, SYNONYM]
      source: objects.json.object_type
    - field_name: physical_column_id
      type: string
      required: true
      source: columns.json.column_id
      mapping: DETERMINISTIC_RENAME_VALUE_UNCHANGED
  source_join:
    locator: asset_id
    role: JOIN_COLUMNS_TO_OBJECTS_ONLY
    canonical_identity_member: false
  prohibited_alias_fields:
    - Agent A table display name is not a stored identity field.
    - Agent A duplicate column display name is not a stored identity field.
    - Agent A duplicate raw-name and raw-comment fields are not emitted.
    - Stage 0 column_id is not emitted beside physical_column_id.
  invariants:
    - One physical_column_id identifies exactly one schema-object-column instance only within one run_id plus profile/schema scope.
    - Equal raw column names in different objects never merge physical identity.
    - object_name may be labeled as 表名 in the UI only when object_type is TABLE.
    - Any source locator remains provenance and cannot become a second identity.
  uniqueness_scope: [run_id, profile_ref, schema_name, physical_column_id]
  new_profile_collision_policy:
    required_before_any_new_profile_run: true
    scan_key: [profile_ref, schema_name, physical_column_id]
    preserve_failures: [ENCODING_FAILURE, PARSER_FAILURE, SOURCE_LOCATOR_FAILURE]
    on_non_unique:
      action: CREATE_TRACEABLE_SURROGATE_WITHOUT_REWRITING_PHYSICAL_FACT
      surrogate_components: [asset_id, ordinal_position, source_artifact_ref, source_locator]
      prohibited_actions: [merge, silent_drop, rename_source_identity, reuse_colliding_identity]
    gate_effect: STOP_BEFORE_P1_WHEN_COLLISION_IS_UNRESOLVED

