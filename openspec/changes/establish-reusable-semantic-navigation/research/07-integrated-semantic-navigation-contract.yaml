page_projection:
  projection_contract_id: '07c:projection:single-page-reader-navigation'
  status: NOT_GENERATED
  page_count: 1
  layout: THREE_COLUMN_WITH_GOVERNANCE_FOOTER
  left_column:
    rule: Show only business areas and concepts relevant to the current topology context.
    groups: [JOURNEY_ENTRIES, CONTRACT_EXISTENCE_DOMAIN, REPEATING_BUSINESS_ACTIVITIES, CROSSCUTTING_SUPPORT]
    prohibition: Do not flatten all 13 research areas into 13 first-level menus.
  center_column:
    required_fields: [unique_reader_identity, stable_definition, exclusions, expression_matrix, qualifier_filters, physical_field_count, table_count, expression_evidence_status, publication_status]
  right_column:
    grouping: Exact column_name_raw within one Reader expression; identity remains physical_column_id.
    required_fields: [physical_field_name, implementation_count, table_count, schema_name, object_name, object_comment_raw, column_comment_raw, data_type_raw, object_detail_entry, evidence, conflicts, unresolved_items]
  footer_governance_states: [OUT_OF_SCOPE, NOT_IN_FIRST_READER_SCOPE, ATTRIBUTE_LAYER, TECHNICAL_CANDIDATE, EVIDENCE_INSUFFICIENT, CONFLICT, NOT_EVALUABLE, TRUE_UNKNOWN, NOT_YET_PROCESSED]
  display_invariants:
    - Each Reader identity appears once even when reachable from several entries.
    - Each expression computes support independently.
    - Configuration seeds are visibly labeled non-evidence.
    - Physical and table counts cite their grain and denominator.
    - Conflict, unresolved, EXCLUDED, and NOT_EVALUABLE remain visible.
    - Reader and object-detail links must resolve to concrete records.
  reader_journey_matrix_contract:
    required_reader_refs_exact: ['reader:counterparty', 'reader:order', 'reader:trade', 'reader:notional', 'reader:position', 'reader:margin']
    required_checks_per_reader: [direct_positive, boundary_or_misleading_counterexample, blocker_visibility, concrete_physical_field_detail, concrete_object_detail, deep_link_restore, return_context_preservation]
    rows:
      - {reader_ref: 'reader:counterparty', direct_positive_case_ref: READER-POS-COUNTERPARTY-A01, boundary_refs: [A03, D02, CXL-001], blocker_refs: [A03, D02], physical_detail_required: true, deep_link_and_return_required: true}
      - {reader_ref: 'reader:order', direct_positive_case_ref: READER-POS-ORDER-H01, boundary_refs: [CXL-007], blocker_refs: [H01], physical_detail_required: true, deep_link_and_return_required: true}
      - {reader_ref: 'reader:trade', direct_positive_case_type: TRADE_DIRECT_POSITIVE, direct_positive_case_ref: READER-POS-TRADE-REQUIRED, direct_positive_status: REQUIRED_NOT_YET_PROVIDED, boundary_refs: [CXL-007, CXL-011], blocker_refs: [CXL-011], physical_detail_required: true, deep_link_and_return_required: true}
      - {reader_ref: 'reader:notional', direct_positive_case_ref: READER-POS-NOTIONAL-C01, boundary_refs: [F01, CXL-006], blocker_refs: [F01], physical_detail_required: true, deep_link_and_return_required: true}
      - {reader_ref: 'reader:position', direct_positive_case_type: POSITION_DIRECT_POSITIVE, direct_positive_case_ref: READER-POS-POSITION-REQUIRED, direct_positive_status: REQUIRED_NOT_YET_PROVIDED, boundary_refs: [CXL-012], blocker_refs: [CXL-012], physical_detail_required: true, deep_link_and_return_required: true}
      - {reader_ref: 'reader:margin', direct_positive_case_type: MARGIN_DIRECT_POSITIVE, direct_positive_case_ref: READER-POS-MARGIN-REQUIRED, direct_positive_status: REQUIRED_NOT_YET_PROVIDED, boundary_refs: [C03, M01, CXL-005], blocker_refs: [M01], physical_detail_required: true, deep_link_and_return_required: true}
    whole_page_stop_rules:
      - Any Reader row is absent or any required check is unexecuted, empty, or hidden.
      - TRADE_DIRECT_POSITIVE is not present and adjudicated.
      - POSITION_DIRECT_POSITIVE is not present and adjudicated.
      - MARGIN_DIRECT_POSITIVE is not present and adjudicated.
  generation_gate:
    - Implementation steps 1 through 7 are complete.
    - All six Readers have a direct positive case and a boundary or misleading-name counterexample.
    - Decisive Suite A, B, and C failures are closed without rewriting historical suites.
    - P0-to-P4 bundle and source hashes are frozen in a Manifest.
    - Configuration schema identity and result-bundle schema identities are uniquely named.
    - Every displayed expression and physical instance is traceable.
    - No publication blocker is hidden; generated page remains a candidate.
  independent_review_readiness_gate:
    - Candidate page has passed real click-journey validation.
    - Review inputs are isolated and hashed.
    - Positive, ambiguous, misleading-name, technical, conflict, and unknown cases are included.
    - No decisive case is unexecuted and no Gate passes vacuously.
    - A new reviewer can reproduce the projection without this conversation.

