        suite_b: [C04, G02]
        suite_c: [CXL-001, CXL-012]
        future_required_case_type: POSITION_DIRECT_POSITIVE
        future_required_case_status: REQUIRED_NOT_YET_PROVIDED
      blocking_cases: [CXL-012]
      minimum_physical_evidence: [subject_account_or_portfolio_anchor, position_responsibility_anchor, quantity_or_balance_distinction, direction_and_time_provenance]
      conflict_blocking_rules: [position_risk_exposure_conflict_blocks_reader, quantity_balance_conflict_blocks_expression]
      publication_gate: [COMMON_PUBLICATION_GATE, POSITION_RISK_EXPOSURE_SEPARATE, POSITION_DIRECT_POSITIVE_PRESENT]
      current_blockers: [FIELD_EVIDENCE_NOT_IMPLEMENTED, DIRECT_POSITIVE_GOLD_REQUIRED, POSITION_VIEW_BOUNDARY_DEFERRED]
    - reader_id: 'reader:margin'
      concept_ref: 'concept:margin'
      reader_status: REWORKED_CANDIDATE
      publication_status: BLOCKED_PENDING_INTEGRATION
      stable_definition: 为覆盖履约风险而计算、要求或记录的保证金额度或状态。
      exclusions: [Collateral, Notional, Position, Valuation, generic amount]
      allowed_field_attributes: [DESCRIPTIVE_TEXT, BUSINESS_OBJECT_STATE, MEASURE, CURRENCY, TIME]
      allowed_qualifiers: [cashflow_direction, currency_basis, observation_time_role, availability_condition, estimation_status, measure_basis, aggregation_state, position_side]
      qualifier_constraints:
        cashflow_direction: MARGIN_DIRECTION remains unresolved without value semantics.
