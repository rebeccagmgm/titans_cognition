      expression_kind_whitelist:
        values_exact: [AMOUNT, BALANCE, THRESHOLD, RATIO, PARAMETER, DIRECTION]
        AMOUNT: {identity_rule: monetary margin measure, cannot_merge_with: [BALANCE, THRESHOLD, RATIO, PARAMETER, DIRECTION]}
        BALANCE: {identity_rule: margin balance at a stated scope and time, cannot_merge_with: [AMOUNT, THRESHOLD, RATIO, PARAMETER, DIRECTION]}
        THRESHOLD: {identity_rule: trigger or maintenance threshold, cannot_merge_with: [AMOUNT, BALANCE, RATIO, PARAMETER, DIRECTION]}
        RATIO: {identity_rule: dimensionless rate or percentage with explicit basis, cannot_merge_with: [AMOUNT, BALANCE, THRESHOLD, PARAMETER, DIRECTION]}
        PARAMETER: {identity_rule: configured margin control value with explicit parameter semantics, cannot_merge_with: [AMOUNT, BALANCE, THRESHOLD, RATIO, DIRECTION]}
        DIRECTION: {identity_rule: direction expression whose value semantics remain independently evidenced, cannot_merge_with: [AMOUNT, BALANCE, THRESHOLD, RATIO, PARAMETER]}
        one_expression_kind_per_expression_version: true
        unknown_or_competing_kind_effect: CONFLICT_AND_BLOCK_EXPRESSION
        cross_kind_collapse_effect: STOP_READER_CANDIDATE
      allowed_entry_refs: ['entry:margin:margin-collateral', 'entry:margin:valuation-risk']
