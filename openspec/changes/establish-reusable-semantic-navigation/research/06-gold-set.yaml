  source_case_ids: "03-gold-set.yaml A01-M01"
  purpose: >-
    Machine-parseable expected semantic-layer decisions for the 27 retained
    regression cases. Expected-after-rework is kept separate from the observed
    current Stage 3/5 baseline.
  non_claims:
    - "This file does not mean the current runtime passes the cases."
    - "This file does not publish a Reader or grant business acceptance."
    - "A provider field-evidence contract does not mean its output is implemented or integrated."
  field_evidence_integration_status: "PENDING_INTEGRATION"
  revised_execution_status: "PENDING_RERUN"
  legacy_oracle_policy: >-
    The historical 03 oracle is not edited. Its first executable baseline must
    change quoting only, as required by 05. This separate 06 fork also follows
    the later explicit instruction to correct self-contradictory direction and
    frozen-description expectations; every such change retains the old oracle
    below as counterevidence and remains PENDING_RERUN.

result_states:
  observed_current: ["PASS", "FAIL", "NOT_EVALUABLE"]
  revised_run: ["PENDING_RERUN", "PASS", "FAIL", "NOT_EVALUABLE"]
  evaluability: ["EVALUABLE", "NOT_EVALUABLE"]

current_observed_baseline:
  source: "05-independent-review.md"
  pass: 6
  fail: 17
  not_evaluable: 4
  disposition: "FAIL"
  note: "Historical result against the current Stage 3/5 projection; it is not overwritten by corrected expectations."

case_contract:
  required_sections:
    - "physical_field"
    - "table_context"
    - "expected_after_rework"
    - "evidence_requirement"
    - "observed_current"
  physical_field_rule: >-
    Use a locatable Schema/Table/Column composite and retain raw name, raw
    comment, and data type. A non-locatable aggregate case uses explicit nulls
    and NOT_EVALUABLE; no physical field is fabricated.
  semantic_rule: >-
    Tokenization, protected phrases, table context, and technical-field
    candidacy are observations only. They cannot decide the base concept,
    qualifier, Reader identity, or publication status.

candidate_observation_registry:
  registry_kind: "PRE_A_SEMANTIC_OBSERVATION"
  counts_toward_core_22_concepts: false
  reader_eligible: false
  identity_rule: >-
    These IDs identify unresolved Gold observations, not business concept
    identities. They cannot appear in the navigation skeleton's concepts or
    Reader scope without a separate adjudication.
  observations:
    - observation_id: "observation:inner-value-ratio"
      label_zh: "内在价值系数"
      next_decision: "Determine the owning Economic Terms concept and expression boundary."
    - observation_id: "observation:interest-interval"
      label_zh: "计息区间/计息起止"
      next_decision: "Determine the owning Contract Leg or Economic Terms context."
    - observation_id: "observation:netting-record-quantity"
      label_zh: "轧差记录买入数量"
      next_decision: "Determine the netting-record object before Reader placement."
    - observation_id: "observation:lifecycle-event-source"
      label_zh: "生命周期事件来源"
      next_decision: "Distinguish business provenance from a standalone concept."
    - observation_id: "observation:valuation-rate-source"
      label_zh: "估值汇率来源"
      next_decision: "Locate the referenced market-reference object's responsibility."

