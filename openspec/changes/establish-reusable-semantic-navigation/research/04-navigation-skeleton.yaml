# ─── 概念—属性表达—物理字段关系模型 ───

relationship_model:
  layers:
    - name: navigation_entry
      description: 生命周期阶段 × 业务区域 = 多入口矩阵
    - name: business_concept
      description: 稳定的业务实体或度量，有唯一身份
      children: [attribute_expression]
    - name: attribute_expression
      description: 概念在物理字段中的具体观察形式
      modifiers: [attribute_axes, qualifier_dimensions]
    - name: physical_implementation
      description: Schema/Table/Column + 证据

  rules:
    - concept_to_expression: one_to_many
    - expression_to_field: one_to_many
    - concept_to_entry: many_to_many
    - axis_to_concept: many_to_many
    - qualifier_to_expression: one_to_many

  prohibitions:
    - 禁止将属性表达提升为独立业务概念
    - 禁止将字段属性轴词提升为业务概念
    - 禁止将限定维度值提升为业务概念
    - 禁止将物理列名 token 直接作为业务语义
    - 禁止将关系表外键误归类为被引用实体的标识

