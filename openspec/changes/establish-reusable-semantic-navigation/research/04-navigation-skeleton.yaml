# ─── 已知缺陷 (来自 03 审计报告) ───
# 不修复，但标注为后续修订输入

known_defects:
  - id: DEFECT-SHORT-LONG
    severity: CRITICAL
    description: 英文 token SHORT/LONG 在列名中歧义爆炸
    impact: 18 字段误判 position_side:SHORT, 1 字段误判 LONG
    root_cause: direction facet 英文 pattern 匹配列名 SHORT/LONG token
    min_fix_principle: |
      direction facet 的英文 pattern 仅在中文注释含"空头"/"多头"时匹配，
      或将 SHORT/LONG 从 direction facet 英文 pattern 中移除，仅保留中文 pattern。
    gold_set_refs: [gold-A01, gold-A02, gold-A03, gold-A04, gold-B01, gold-C01, gold-C02, gold-C03, gold-C04, gold-F01]

  - id: DEFECT-SOURCE-TARGET
    severity: MODERATE
    description: SOURCE/TARGET 数据流向与业务主体角色混淆
    impact: 15 个属性表达被附加 flow_side 限定
    root_cause: party_role SOURCE/TARGET 经 qualifier_axes 映射到 flow_side
    min_fix_principle: |
      party_role 的 SOURCE/TARGET 与 flow_side 分离为两个独立维度，
      或在 qualifier_axes 映射中不再将 party_role:SOURCE/TARGET 映射到 flow_side。
    gold_set_refs: [gold-D01, gold-D02, gold-J01, gold-J02]

  - id: DEFECT-GENERIC-WORD
    severity: MODERATE
    description: 泛化词被提升为 DOMAIN scope 业务概念
    impact: 7 个概念 (状态/类型/金额/币种/日期/简称/缩写)
    root_cause: 概念提升逻辑未将 field_families/broad_categories 概念降级为 ATTRIBUTE
    min_fix_principle: |
      field_families 和 broad_categories 中已定义的泛化词在 context 投影中
      标记为 ATTRIBUTE 或 TECHNICAL scope，不进入业务概念树。
    gold_set_refs: [gold-E01, gold-E02, gold-E03, gold-E04, gold-L01]

  - id: DEFECT-NAME-COMMENT-CONFLICT
    severity: LOW
    description: 列名 token 与中文注释方向冲突时优先级错误
    impact: 1 字段 (SHORT_DYNAMIC_NOTIONAL_ORG)
    root_cause: facet 提取不区分列名来源与注释来源的优先级
    min_fix_principle: |
      当列名 token 与注释中文词义冲突时，注释优先；
      冲突标记为 CONFLICT 状态而非自动归属。
    gold_set_refs: [gold-F01]

  - id: DEFECT-ORDER-TRADE-MERGE
    severity: LOW
    description: 订单与交易在导航层合并
    impact: reader:trade-order source_labels
    root_cause: 导航配置将订单和交易概念合并
    min_fix_principle: 导航层合并可接受，概念层应保持分离
    gold_set_refs: [gold-H01]

