  predecessor_contract:
    authorization_is_not_gate_result: true
    step_01: REWORK_BOUNDED_AUTHORIZATION explicitly covering step 01; no predecessor GateResult.
    step_02: Same authorization explicitly covering step 02 plus step 01 PASS and exact content hash.
