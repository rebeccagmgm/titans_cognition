      current_execution_status: NOT_EXECUTED
    - assertion_id: '07v:assert:closed-resolution-status'
      expectation: P2 semantic_resolution_status is one of CANDIDATE, UNBOUND, CONFLICT, DEFERRED, or NOT_APPLICABLE and never a P3 or publication state.
      current_execution_status: NOT_EXECUTED
    - assertion_id: '07v:assert:canonical-semantic-reachability'
      expectation: All 8 field attributes and all 12 qualifier dimensions have an explicit direct or composite P2 candidate route and all three behavioral classes are executed with nonempty observations or explicit NOT_APPLICABLE; static route presence, empty sets, and unexecuted cases never pass.
      current_execution_status: NOT_EXECUTED
  cases:
    - case_id: CXL-001
      title: SHORT_NAME observation cannot become position_side
      source_case_refs: [FEP-001, FEP-002, FEP-003, FEP-023, A01, B01]
      physical_input: canonical_physical_field
      p1_expectation: NAME_VARIANT_OBSERVATION with the naked SHORT or LONG rule suppressed
      p2_expectation: DESCRIPTIVE_TEXT candidate only after owning object anchor
      prohibited_result: formal position_side or Reader publication from name length
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-002
      title: Explicit Chinese short direction is only a candidate before object applicability
      source_case_refs: [FEP-007, C01]
      physical_input: TITANS_TRADEFLOW.REF_FAST_TRS.SHORT_DYNAMIC_NOTIONAL
      p1_expectation: candidate_qualifier_observations emits dimension position_side, value SHORT, and comment provenance
      p2_expectation: a qualifier candidate requires bounded Notional ownership, position-side applicability, independent context, and dimension compatibility; otherwise emit UNBOUND or CONFLICT without formal promotion
      p3_expectation: semantic decision is required before formal qualifier
      prohibited_result: P3 prerequisite in candidate formation, P3-to-P2 feedback, or Reader publication directly from the P1 observation
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-003
      title: SOURCE_CTPTY_ID mapping context cannot directly publish flow_side
      source_case_refs: [FEP-006, D02]
      physical_input: TITANS_TRADEFLOW.TRS_FAST_MAPPING_CONFIG.SOURCE_CTPTY_ID
      p1_expectation: IDENTIFIER_SHAPE plus LINEAGE_METADATA candidate and mapping context
      p2_expectation: flow-side candidate only after explicit input-output responsibility evidence
      p3_expectation: TRADEFLOW-only semantic decision required
      prohibited_result: formal flow_side or Counterparty publication directly from P1
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-004
      title: IDENTIFIER_SHAPE without object anchor cannot become IDENTIFIER decision
      source_case_refs: [FEP-015, FEP-017, H01]
      p1_expectation: IDENTIFIER_SHAPE observation with retained missing context
      p2_expectation: UNBOUND or competing object anchor candidate
      prohibited_result: P3 IDENTIFIER or Reader identity without an adjudicated object
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-005
      title: Technical candidate cannot enter a business Reader
      source_case_refs: [FEP-019, FEP-020, FEP-021, FEP-022]
      p1_expectation: technical status remains CANDIDATE or UNRESOLVED
      p2_expectation: route to TECHNICAL_CANDIDATE governance state
      prohibited_result: business Reader membership, silent deletion, or confirmed AUDIT before validation
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-006
      title: Name-comment conflict blocks expression and critical Reader publication
      source_case_refs: [FEP-009, F01]
      physical_input: TITANS_TRADEFLOW.REF_LS_TRS.SHORT_DYNAMIC_NOTIONAL_ORG
      p1_expectation: retain both raw direction claims and NAME_COMMENT_CONFLICT
      p2_expectation: mutually visible interpretations and required next evidence
      p4_expectation: Notional expression is blocked; Reader publication is blocked while identity-critical impact is open
      prohibited_result: fixed name or comment priority
      current_execution_status: NOT_EXECUTED
    - case_id: CXL-007
