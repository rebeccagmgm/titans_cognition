      - reader_ref: 'reader:margin'
        direct_positive: {case_type: MARGIN_DIRECT_POSITIVE, case_ref: READER-POS-MARGIN-REQUIRED, status: REQUIRED_NOT_YET_PROVIDED}
        boundary_or_misleading: {case_refs: [C03, M01, CXL-005], status: NOT_EXECUTED}
        blocker_visibility: {blocker_refs: [M01], status: NOT_EXECUTED}
        detail_and_navigation: {physical_field: REQUIRED, object_detail: REQUIRED, deep_link_restore: REQUIRED, return_context: REQUIRED, status: NOT_EXECUTED}
    whole_page_gate:
      exact_six_rows_required: true
      all_required_checks_executed_and_nonempty: true
      trade_direct_positive_required: true
      position_direct_positive_required: true
      margin_direct_positive_required: true
      current_status: STOP_TRADE_POSITION_AND_MARGIN_DIRECT_POSITIVES_MISSING
  assertions:
    - Left navigation shows contextual areas rather than 13 fixed first-level menus.
    - Center panel shows one Reader identity and an expression-level matrix.
    - Right panel shows Canonical physical details and working object-detail entries.
    - Footer distinguishes all nine governance states.
    - Counts expose grain and denominator.
    - Candidate page makes no publication or acceptance claim.
    - Expanded tree, selected Reader, expression, physical field, and detail state survive deep-link open and return navigation.

