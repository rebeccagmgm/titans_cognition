decisive_cases:
  - decisive_case_id: '07v:decisive:raw-whitespace'
    case_refs: [FEP-001, FEP-002, A03, B01]
    decisive_reason: Raw physical facts and source spans must survive integration unchanged.
    failure_effect: STOP_BEFORE_P1_HANDOFF
  - decisive_case_id: '07v:decisive:name-direction'
    case_refs: [A01, A02, A04, B01, CXL-001]
    decisive_reason: Name length must never become position direction.
    failure_effect: BLOCK_ALL_AFFECTED_READERS_AND_PAGE_GENERATION
  - decisive_case_id: '07v:decisive:explicit-direction'
    case_refs: [FEP-007, C01, CXL-002]
    decisive_reason: Explicit direction may form a candidate only through object applicability and adjudication.
    failure_effect: BLOCK_NOTIONAL_EXPRESSION_AND_PAGE_GENERATION
  - decisive_case_id: '07v:decisive:semantic-only-qualifier-reachability'
    case_refs: [C03, K01]
    decisive_reason: Explicit ratio and initial-time evidence must create measure_basis and observation_time_role P2 candidates before any P3 decision; RATE or TIME alone remains insufficient.
    failure_effect: STOP_SUITE_B_SEMANTIC_ADJUDICATION
  - decisive_case_id: '07v:decisive:source-target'
    case_refs: [FEP-006, D02, CXL-003]
    decisive_reason: Mapping context is required but is not itself a formal flow-side decision.
    failure_effect: BLOCK_FLOW_SIDE_AND_COUNTERPARTY_PUBLICATION
  - decisive_case_id: '07v:decisive:identifier-anchor'
    case_refs: [FEP-015, FEP-017, H01, CXL-004]
    decisive_reason: An IDENTIFIER candidate requires a single bounded owning-object candidate, and a formal IDENTIFIER decision requires confirmed P3 ownership.
    failure_effect: BLOCK_ORDER_TRADE_AND_AFFECTED_EXPRESSIONS
  - decisive_case_id: '07v:decisive:technical-isolation'
    case_refs: [FEP-019, FEP-020, FEP-021, FEP-022, CXL-005]
    decisive_reason: Technical candidates remain visible outside business Readers.
    failure_effect: STOP_PAGE_GENERATION
  - decisive_case_id: '07v:decisive:conflict-preservation'
    case_refs: [FEP-009, F01, CXL-006]
    decisive_reason: Conflicting raw claims cannot auto-resolve or disappear.
    failure_effect: BLOCK_AFFECTED_EXPRESSION_AND_READER_PUBLICATION
  - decisive_case_id: '07v:decisive:order-trade-split'
    case_refs: [H01, CXL-007]
    decisive_reason: Order and Trade require separate Reader identities and identifiers.
    failure_effect: BLOCK_ORDER_AND_TRADE_READERS
  - decisive_case_id: '07v:decisive:physical-identity-isolation'
    case_refs: [FEP-001, FEP-023, CXL-008]
    decisive_reason: Equal names across objects are separate physical instances.
    failure_effect: STOP_PROVIDER_OUTPUT
  - decisive_case_id: '07v:decisive:excluded-retention'
    case_refs: [CXL-009]
    decisive_reason: Full-corpus preparation must retain fields outside the downstream workset.
    failure_effect: STOP_FULL_EVIDENCE_PACK_GATE
  - decisive_case_id: '07v:decisive:expression-support'
    case_refs: [CXL-010]
    decisive_reason: Reader support is calculated per expression.
    failure_effect: STOP_PAGE_GENERATION
  - decisive_case_id: '07v:decisive:trade-positive-gap'
    case_refs: [FEP-016, CXL-011]
    decisive_reason: A protected Trade token is not a direct positive business decision.
    failure_effect: BLOCK_TRADE_READER_PAGE_GENERATION_UNTIL_DIRECT_POSITIVE_EXISTS
  - decisive_case_id: '07v:decisive:position-positive-gap'
    case_refs: [FEP-018, CXL-012]
    decisive_reason: Quantity and Position tokens do not distinguish Position from balance or Risk Exposure.
    failure_effect: BLOCK_POSITION_READER_PAGE_GENERATION_UNTIL_DIRECT_POSITIVE_EXISTS

evaluability_rules:
  - rule_id: '07v:evaluability:physical-anchor'
    rule: A physical case is evaluable only when its canonical physical_column_id resolves in the frozen Stage 0 artifacts.
  - rule_id: '07v:evaluability:no-fabrication'
    rule: Aggregate labels without a physical anchor remain NOT_EVALUABLE; no field is fabricated.
  - rule_id: '07v:evaluability:source-hash'
    rule: A source hash mismatch makes the entire referenced source suite not executable.
  - rule_id: '07v:evaluability:layer-prerequisite'
    rule: A semantic case cannot execute when its P1 Evidence Pack or required handoff record is absent.
  - rule_id: '07v:evaluability:conflict'
    rule: An open conflict is evaluable as a conflict and must not be converted to a semantic success or generic failure.
  - rule_id: '07v:evaluability:explicit-non-evaluable'
    rule: Suite B E02, E03, and E04 remain NOT_EVALUABLE until concrete physical anchors are separately authorized and added in a future suite version.
  - rule_id: '07v:evaluability:handoff-input-closure'
    rule: The handoff is executable only when all 16 P1 blocks and every declared generic, abbreviation, technical, and qualifier observation value and status have explicit routes.
  - rule_id: '07v:evaluability:acyclic-layer-direction'
    rule: P1-to-P2 candidate formation cannot consume a P3 decision; P2-to-P3 may accept, reject, or defer but cannot rewrite P2.
  - rule_id: '07v:evaluability:p2-status-vocabulary'
    rule: A P2 candidate is not evaluable when semantic_resolution_status is outside the five-value P2 vocabulary.
  - rule_id: '07v:evaluability:canonical-semantic-reachability'
    rule: Suite B cannot execute when an expected field attribute or qualifier lacks a declared P2 candidate route; P3 cannot fabricate the missing candidate.

