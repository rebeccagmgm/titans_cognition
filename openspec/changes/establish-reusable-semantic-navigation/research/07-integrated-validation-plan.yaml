  source_verification_status: SOURCE_REFS_DEFINED
  rule_execution_status: NOT_EXECUTED
  semantic_adjudication_status: NOT_EXECUTED
  handoff_contract_assertions:
    - assertion_id: '07v:assert:all-p1-blocks-routed'
      expectation: Every one of the 16 Provider output blocks has exactly one declared routing role before implementation.
      current_execution_status: NOT_EXECUTED
    - assertion_id: '07v:assert:closed-observation-vocabulary'
      expectation: All 13 generic attribute values and both statuses, both abbreviation statuses, all 10 technical classes and both statuses, and all 5 candidate qualifier dimensions use only Provider-defined vocabulary and have explicit routes; every canonical currency comparison uses only the four full enum values.
      current_execution_status: NOT_EXECUTED
