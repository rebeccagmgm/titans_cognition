failure_stop_conditions:
  - failure_stop_id: '07v:stop:source-hash-mismatch'
    condition: Either referenced 06 Gold file hash differs from source_suite_hashes.
    stop_before: all_suite_execution
  - failure_stop_id: '07v:stop:raw-overwrite'
    condition: Any raw field, comment, whitespace, or source span is overwritten by normalization.
    stop_before: p1_handoff
  - failure_stop_id: '07v:stop:identity-loss'
    condition: A physical field is missing, duplicated, merged by name, or cannot resolve its object source.
    stop_before: p1_handoff
  - failure_stop_id: '07v:stop:handoff-input-unrouted'
    condition: Any Provider output block or declared observation value has no explicit P1-to-P2 route.
    stop_before: p1_handoff_implementation
  - failure_stop_id: '07v:stop:undefined-observation-vocabulary'
    condition: A handoff mapping consumes an observation, dimension, value, or status not declared by the Provider or this Canonical adapter.
    stop_before: p1_handoff_implementation
  - failure_stop_id: '07v:stop:p3-to-p2-cycle'
    condition: P1-to-P2 candidate formation requires a P3 decision, or P3 rewrites or regenerates a P2 candidate.
    stop_before: semantic_adjudication
  - failure_stop_id: '07v:stop:unreachable-formal-semantic'
    condition: Any of the 8 field attributes or 12 qualifier dimensions lacks a direct or composite P2 candidate route, including measure_basis for C03 or observation_time_role for K01.
    stop_before: suite_b_execution
  - failure_stop_id: '07v:stop:semantic-leap'
    condition: A token or P1 observation creates a P3 decision, formal qualifier, or Reader.
    stop_before: semantic_adjudication
  - failure_stop_id: '07v:stop:technical-leak'
    condition: A technical candidate enters a business Reader or is silently removed.
    stop_before: page_generation
  - failure_stop_id: '07v:stop:open-decisive-conflict'
    condition: A decisive conflict lacks both visible interpretations or required next evidence.
    stop_before: page_generation
  - failure_stop_id: '07v:stop:reader-identity-merge'
    condition: Order and Trade share or inherit a Reader identity or identifier.
    stop_before: reader_candidate_generation
  - failure_stop_id: '07v:stop:reader-positive-gap'
    condition: Any of the six Readers lacks a direct positive and a boundary or misleading-name counterexample.
    stop_before: page_generation
  - failure_stop_id: '07v:stop:schema-identity-collision'
    condition: Configuration schema identity and Reader or result-bundle schema identity are not uniquely separated.
    stop_before: provider_or_page_generation
  - failure_stop_id: '07v:stop:legacy-seed-silent-migration'
    condition: The ten first-reader entries are treated as deletion, replacement, or migration of the 31 legacy seeds without a versioned mapping.
    stop_before: current_entry_replacement
  - failure_stop_id: '07v:stop:expression-support-inheritance'
    condition: An expression inherits support from another expression or source concept.
    stop_before: page_generation
  - failure_stop_id: '07v:stop:historical-suite-rewrite'
    condition: A 06 Gold file or historical observed result is changed rather than overlaid and referenced.
    stop_before: all_suite_execution
  - failure_stop_id: '07v:stop:vacuous-gate'
    condition: A Gate succeeds because decisive cases were omitted, not executed, or relabeled not applicable.
    stop_before: independent_review
  - failure_stop_id: '07v:stop:acceptance-claim'
    condition: Gold, YAML parsing, page generation, or independent review is represented as business acceptance or cross-schema validation.
    stop_before: delivery

