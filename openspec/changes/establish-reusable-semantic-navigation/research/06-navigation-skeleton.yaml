metadata:
  skeleton_id: "otc-semantic-navigation-v3-reworked-candidate"
  version: "v3-reworked-candidate"
  status: "REWORKED_CANDIDATE"
  scope: "TITANS_TRADEFLOW"
  artifact_kind: "RESEARCH_CONFIGURATION_SKELETON"
  proposal_date: "2026-08-14"
  source_reports:
    - "01-domain-skeleton.md"
    - "02-field-corpus-analysis.md"
    - "02-field-shapes.json"
    - "03-disambiguation-audit.md"
    - "03-gold-set.yaml"
    - "04-integrated-navigation-proposal.md"
    - "04-navigation-skeleton.yaml"
    - "05-independent-review.md"
  boundary_statement: >-
    Research-only business skeleton and Reader candidate scope. This file is not
    a published ontology, current runtime configuration, business acceptance,
    cross-schema authorization, or scale authorization.
  current_status_preserved:
    reader_delivery: "NOT_DELIVERED"
    business_acceptance: "NOT_ACCEPTED"
    scale_authorization: "PROHIBITED"

candidate_states:
  reader_states:
    - "CANDIDATE"
    - "REWORKED_CANDIDATE"
    - "EVIDENCE_SUPPORTED_CANDIDATE"
    - "DEFERRED"
  evidence_states:
    - "SUPPORT"
    - "CONTRADICT"
    - "CONTEXT_ONLY"
    - "NOT_APPLICABLE"
    - "NOT_OBSERVED"
  semantic_resolution_states:
    - "CANDIDATE"
    - "CONFLICT"
    - "INSUFFICIENT_EVIDENCE"
    - "UNKNOWN"
    - "NOT_EVALUABLE"
    - "OUT_OF_SCOPE"
    - "UNRESOLVED"
    - "DEFERRED"
  publication_states:
    - "PUBLISHED"
    - "NOT_PUBLISHED"
    - "BLOCKED_PENDING_INTEGRATION"
    - "BLOCKED_BY_CONFLICT"
    - "BLOCKED_BY_INSUFFICIENT_EVIDENCE"
    - "BLOCKED_BY_UNRESOLVED_IDENTITY"
    - "BLOCKED_BY_UNRESOLVED_MAPPING_ROLE"
    - "BLOCKED_BY_UNRESOLVED_OBJECT"
    - "BLOCKED_BY_UNRESOLVED_QUALIFIER"
    - "NOT_IN_FIRST_READER_SCOPE"
    - "PROHIBITED"
  state_grain_invariants:
    - "CONFLICT is a semantic-resolution state supported by contradictory evidence; it is not evidence itself."
    - "INSUFFICIENT_EVIDENCE means a candidate lacks required support; UNKNOWN means no defensible interpretation is available."
    - "NOT_EVALUABLE means required frozen input is absent; OUT_OF_SCOPE means the case is intentionally excluded."
    - "NOT_PUBLISHED is a publication result and must not be converted to UNKNOWN."
  integration_states:
    - "PENDING_INTEGRATION"
    - "INTEGRATED_NOT_VERIFIED"
    - "VERIFIED_FOR_CASE"
  prohibited_claims:
    - "VALIDATED"
    - "ACCEPTED"
    - "CONFIRMED"
    - "BUSINESS_APPROVED"

journey_entries:
  - id: "journey:trade-preparation"
    label_zh: "交易准备"
    definition: "使客户、交易对手、产品和交易关系具备进入交易流程条件的入口。"
    entry_kind: "JOURNEY_ENTRY"
    ends_when: "可以发起询价、报价或订单；不代表交易已达成。"
  - id: "journey:inquiry-quote-order"
    label_zh: "询价、报价与订单"
    definition: "从交易意图、询价和报价到形成可执行订单的入口。"
    entry_kind: "JOURNEY_ENTRY"
    ends_when: "订单被执行、拒绝、撤销或失效；Order 不因此成为 Trade。"
  - id: "journey:execution-trade-formation"
    label_zh: "执行与交易形成"
    definition: "执行订单或协商结果并形成 Trade 经济事实的入口。"
    entry_kind: "JOURNEY_ENTRY"
    ends_when: "Trade 被唯一识别；不自动等于法律合同已形成。"
  - id: "journey:contract-formation"
    label_zh: "合同形成"
    definition: "把 Trade 与适用 Agreement、Trade Contract、Leg 和 Economic Terms 关联的入口。"
    entry_kind: "JOURNEY_ENTRY"
    ends_when: "合同身份及其适用条款形成，进入合同存在包络。"

contract_envelopes:
  - id: "envelope:contract-existence"
    label_zh: "合同存在包络"
    definition: "从合同形成到到期、终止或其他关闭结果之间，承载状态、义务和重复活动的持续边界。"
    entry_kind: "ENVELOPE"
    begins_at_relation: "journey:contract-formation may produce this envelope"
    is_serial_stage: false
    contains_relationships:
      - "concept:agreement governs concept:trade-contract"
      - "concept:trade-contract composed_of concept:contract-leg"
      - "concept:trade-contract and concept:contract-leg specified_by concept:economic-terms"

repeating_activities:
  - id: "activity:lifecycle-events"
    label_zh: "生命周期事件"
    definition: "在合同存在期间可多次改变条款、主体、数量或状态的事件。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:valuation-risk"
    label_zh: "估值与风险"
    definition: "在不同时点、方法和范围下反复计算价值与风险敞口。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:margin-collateral"
    label_zh: "保证金与抵押品"
    definition: "反复计算履约保障要求并记录抵押品的提供、占用或释放。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:cashflow-obligation"
    label_zh: "现金流与结算义务"
    definition: "由条款或事件产生计划/实际现金流并形成应收应付义务。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:clearing"
    label_zh: "清算"
    definition: "对义务进行确认、匹配、净额化或形成结算指令。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:payment-transfer-delivery"
    label_zh: "支付、转移与交割"
    definition: "履行资金、资产或标的交付义务的动作。"
    activity_kind: "REPEATING_ACTIVITY"
  - id: "activity:settlement-result"
    label_zh: "结算结果"
    definition: "记录结算义务履行的成功、失败、部分完成或待处理结果。"
    activity_kind: "REPEATING_ACTIVITY"

crosscutting_planes:
  - id: "crosscut:market-reference-business-configuration"
    label_zh: "市场参考与业务配置"
    definition: "为旅程入口和重复活动提供市场参考、日历、曲线、映射和业务参数。"
    plane_kind: "CROSSCUTTING_SUPPORT"
  - id: "crosscut:operations-reconciliation-reporting"
    label_zh: "运营、对账与报表"
    definition: "跨旅程和合同包络执行运营处理、核对、报表和监管报送。"
    plane_kind: "CROSSCUTTING_SUPPORT"
  - id: "crosscut:technical-processing-audit"
    label_zh: "技术加工与审计"
    definition: "记录批次、同步、加工血缘、创建修改和技术控制。"
    plane_kind: "CROSSCUTTING_SUPPORT"

topology_relation_contract:
  journey_relation_kind: "CANDIDATE_PRECEDES_OR_PRODUCES"
  journey_is_universal_sequence: false
  repeating_activity_cardinality: "ZERO_OR_MANY"
  repeating_activity_order: "PARTIAL_ORDER_WITH_BRANCHES_AND_REENTRY"
  settlement_chain_is_mandatory: false
  counterexamples:
    - "An existing contract may receive an amendment or termination event without a new inquiry or order."
    - "Valuation, risk, and margin can repeat before, between, or after cash-flow events."
    - "A lifecycle event can create no settlement obligation, one obligation, or multiple obligations."
    - "Clearing, payment/transfer, and delivery can branch by product and obligation type; failure can re-enter operations or settlement handling."

business_areas:
  - id: "area:parties-relations"
    label_zh: "参与主体与关系"
    definition: "法律实体、机构、人员以及客户和交易对手关系。"
    includes: ["Party", "Customer relation", "Counterparty relation", "机构", "人员"]
    excludes: ["BUY/SELL", "SOURCE/TARGET", "名称长短"]
    object_event_relations: ["Party", "Customer", "Counterparty", "participates_in"]
    tradeflow_evidence: "对手方 ID/名称可定位；Customer/Counterparty 边界仍有反证。"
    reader_eligibility: ["reader:counterparty"]
  - id: "area:products-underlyings"
    label_zh: "产品与标的"
    definition: "可交易产品定义、产品实例、标的及其引用关系。"
    includes: ["Product", "Underlying", "references"]
    excludes: ["单笔 Trade Contract", "行情值", "Valuation result"]
    object_event_relations: ["Product", "Underlying", "references"]
    tradeflow_evidence: "存在字段候选，但稳定身份尚未裁定。"
    reader_eligibility: []
  - id: "area:inquiry-quote-order-trade"
    label_zh: "询价、报价、订单与交易"
    definition: "从交易意向到执行事实的对象和事件。"
    includes: ["Inquiry", "Quote", "Order", "Trade", "execution"]
    excludes: ["Trade Contract", "Position", "Settlement Result"]
    object_event_relations: ["Inquiry", "Quote", "Order", "Trade", "precedes", "executes"]
    tradeflow_evidence: "Order ID 与 Trade ID 可区分；当前合并 Reader 是反证。"
    reader_eligibility: ["reader:order", "reader:trade"]
  - id: "area:agreements-contracts-terms"
    label_zh: "协议、合同与条款"
    definition: "Agreement、Trade Contract、Contract Leg 与 Economic Terms 的层级和关系。"
    includes: ["Agreement", "Trade Contract", "Contract Leg", "Economic Terms"]
    excludes: ["Lifecycle Event", "Order", "运营批次"]
    object_event_relations: ["governs", "composed_of", "specified_by"]
    tradeflow_evidence: "合同、腿和名义本金字段提供候选锚点，关系未获业务确认。"
    reader_eligibility: ["reader:notional"]
  - id: "area:lifecycle-events"
    label_zh: "生命周期事件"
    definition: "合同存在期间改变主体、条款、数量或状态的业务事件。"
    includes: ["reset", "exercise", "amendment", "increase", "termination"]
    excludes: ["INITIAL/CURRENT qualifier", "技术任务状态"]
    object_event_relations: ["changes contract", "changes position"]
    tradeflow_evidence: "当前 Stage 5 没有 BUSINESS_EVENT 入口。"
    reader_eligibility: []
  - id: "area:positions-risk"
    label_zh: "持仓、头寸与风险"
    definition: "持仓记录、按口径形成的头寸视图以及风险敞口。"
    includes: ["Position", "Position View", "Risk Exposure"]
    excludes: ["Order quantity", "sync task count", "Notional"]
    object_event_relations: ["position_of", "aggregated_as", "measured_as"]
    tradeflow_evidence: "持仓数量有字段支持；任务同步总数是名称反例。"
    reader_eligibility: ["reader:position"]
  - id: "area:valuation"
    label_zh: "估值"
    definition: "在给定时点和方法下计算合同或持仓价值。"
    includes: ["Valuation", "valuation input", "valuation result"]
    excludes: ["Market Reference identity", "Margin", "Risk Exposure"]
    object_event_relations: ["values", "uses_reference"]
    tradeflow_evidence: "估值来源字段只提供上下文，不能单独确认过程。"
    reader_eligibility: []
  - id: "area:margin-collateral"
    label_zh: "保证金与抵押品"
    definition: "履约保障要求/金额与为其提供的资产。"
    includes: ["Margin", "Collateral", "secures"]
    excludes: ["Valuation", "Cash Flow", "generic amount"]
    object_event_relations: ["Margin", "Collateral", "secures obligation"]
    tradeflow_evidence: "Margin 有当前候选；Collateral 相关语义仍有 Conflict。"
    reader_eligibility: ["reader:margin"]
  - id: "area:cashflow-clearing-settlement"
    label_zh: "现金流、清算与结算"
    definition: "从现金流和结算义务到清算、支付/转移、交割和结果的链。"
    includes: ["Cash Flow", "Settlement Obligation", "Clearing", "Payment/Transfer", "Delivery", "Settlement Result"]
    excludes: ["含结算字样的技术任务", "Valuation"]
    object_event_relations: ["creates_obligation", "clears", "fulfills", "results_in"]
    tradeflow_evidence: "当前 clearing/settlement 阶段为空，不能声称覆盖。"
    reader_eligibility: []
  - id: "area:market-reference"
    label_zh: "市场参考"
    definition: "市场、汇率、曲线、日历等业务参考数据。"
    includes: ["Market Reference", "rate", "curve", "calendar"]
    excludes: ["SOURCE token", "ETL source", "Valuation result"]
    object_event_relations: ["observes", "prices", "references"]
    tradeflow_evidence: "VALUATION_RATE_SOURCE_ID 只提供定位线索。"
    reader_eligibility: []
  - id: "area:business-configuration"
    label_zh: "业务配置与控制"
    definition: "明确改变业务处理的参数、映射和控制规则。"
    includes: ["Business Rule", "Business Mapping", "control parameter"]
    excludes: ["generic TYPE", "generic FLAG", "technical configuration"]
    object_event_relations: ["governs", "maps"]
    tradeflow_evidence: "映射表名只能提供 CONTEXT_ONLY。"
    reader_eligibility: []
  - id: "area:operations-reconciliation-reporting"
    label_zh: "运营、对账与报表"
    definition: "跨业务过程的运营处理、核对、报表和监管报送。"
    includes: ["operations", "reconciliation", "reporting"]
    excludes: ["business concept identity", "technical audit field"]
    object_event_relations: ["reconciles", "reports"]
    tradeflow_evidence: "横切入口，不作为字段多数投票器。"
    reader_eligibility: []
  - id: "area:technical-processing-audit"
    label_zh: "技术加工与审计"
    definition: "批次、同步、加工血缘、创建修改和技术控制观察。"
    includes: ["batch", "sync", "lineage", "created/updated audit"]
    excludes: ["Customer", "Trade", "Contract", "business Reader"]
    object_event_relations: ["processed_by", "audited_by"]
    tradeflow_evidence: "技术字段候选必须隔离且保留原始事实。"
    reader_eligibility: []

semantic_layers:
  - layer: "A"
    id: "BUSINESS_CONCEPT"
    definition: "稳定识别对象、事件、过程、度量、控制或关系。"
    example: "concept:notional"
    prohibited_escalation: "Token, table name, sibling count, or field count cannot create a concept."
  - layer: "B"
    id: "ATTRIBUTE_EXPRESSION"
    definition: "业务概念在具体业务语境中的表达。"
    example: "空头动态名义本金（结算币种）"
    prohibited_escalation: "Expression variants cannot duplicate concept identity."
  - layer: "C"
    id: "FIELD_ATTRIBUTE"
    definition: "跨业务概念复用的字段属性形态。"
    example: "MEASURE"
    prohibited_escalation: "Broad DIRECTION or CONFIGURATION is not allowed."
  - layer: "D"
    id: "QUALIFIER"
    definition: "对表达或字段属性的正交限定，不改变概念身份。"
    example: "position_side=SHORT"
    prohibited_escalation: "Qualifier observations cannot publish a Reader."
  - layer: "E"
    id: "PHYSICAL_IMPLEMENTATION"
    definition: "可定位 Schema/Table/Column 事实及证据。"
    example: "TITANS_TRADEFLOW.REF_FAST_TRS.SHORT_DYNAMIC_NOTIONAL"
    prohibited_escalation: "Raw names/comments are immutable; equal column names do not merge instances."

concepts:
  - id: "concept:customer"
    label_zh: "客户"
    stable_definition: "与本机构存在服务、准入或账户关系的 Party-in-relation。"
    excludes: ["Counterparty by default", "Party master identity"]
    concept_type: "RELATION"
    navigation_entries: ["journey:trade-preparation", "area:parties-relations"]
    reader_status: "DEFERRED"
    evidence_boundary: "客户短名不足以证明 Customer 与 Counterparty 同义。"
  - id: "concept:counterparty"
    label_zh: "交易对手"
    stable_definition: "在协议、订单或交易关系中承担对手方关系的 Party-in-relation。"
    excludes: ["Customer by default", "SOURCE/TARGET", "SHORT/LONG name form"]
    concept_type: "RELATION"
    navigation_entries: ["journey:trade-preparation", "journey:execution-trade-formation", "area:parties-relations"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "ID/名称字段支持；当前方向误标仍是反证。"
  - id: "concept:product"
    label_zh: "产品"
    stable_definition: "定义可交易经济结构和规则的产品类别或实例。"
    excludes: ["Trade Contract", "Underlying", "generic TYPE"]
    concept_type: "OBJECT"
    navigation_entries: ["journey:trade-preparation", "area:products-underlyings"]
    reader_status: "DEFERRED"
    evidence_boundary: "稳定身份尚未审阅。"
  - id: "concept:underlying"
    label_zh: "标的"
    stable_definition: "决定衍生价值或交付内容的资产、指数或参考项。"
    excludes: ["Product", "market value", "Valuation result"]
    concept_type: "OBJECT"
    navigation_entries: ["area:products-underlyings", "area:agreements-contracts-terms"]
    reader_status: "DEFERRED"
    evidence_boundary: "跨产品线歧义未裁定。"
  - id: "concept:inquiry"
    label_zh: "询价"
    stable_definition: "发起获取可交易条件的信息请求。"
    excludes: ["Quote", "Order", "Trade"]
    concept_type: "EVENT"
    navigation_entries: ["journey:inquiry-quote-order", "area:inquiry-quote-order-trade"]
    reader_status: "DEFERRED"
    evidence_boundary: "无稳定 Reader 证据链。"
  - id: "concept:quote"
    label_zh: "报价"
    stable_definition: "针对询价或交易意图给出的价格和条款提议。"
    excludes: ["Order", "Trade", "Valuation"]
    concept_type: "OBJECT"
    navigation_entries: ["journey:inquiry-quote-order", "area:inquiry-quote-order-trade"]
    reader_status: "DEFERRED"
    evidence_boundary: "报价与价格/估值需消歧。"
  - id: "concept:order"
    label_zh: "订单"
    stable_definition: "指示拟执行交易的意图或指令，可撤销、拒绝或未成交。"
    excludes: ["Trade", "Trade Contract"]
    concept_type: "OBJECT"
    navigation_entries: ["journey:inquiry-quote-order", "area:inquiry-quote-order-trade"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "订单主键是与 Trade 拆分的决定性反例。"
  - id: "concept:trade"
    label_zh: "交易"
    stable_definition: "已经执行并形成经济事实的交易记录。"
    excludes: ["Order", "Trade Contract"]
    concept_type: "OBJECT"
    navigation_entries: ["journey:execution-trade-formation", "area:inquiry-quote-order-trade"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "Trade ID 不得继承 Order ID。"
  - id: "concept:trade-contract"
    label_zh: "合约"
    stable_definition: "合同形成后承载一笔或一组交易权利义务的合同身份。"
    excludes: ["Agreement", "Trade", "Economic Terms collection"]
    concept_type: "OBJECT"
    navigation_entries: ["journey:contract-formation", "envelope:contract-existence", "area:agreements-contracts-terms"]
    reader_status: "DEFERRED"
    evidence_boundary: "法律层级需业务材料。"
  - id: "concept:contract-leg"
    label_zh: "合约腿"
    stable_definition: "合约中具有独立付款、标的或计算安排的组成部分。"
    excludes: ["Notional", "leg identifier as concept"]
    concept_type: "OBJECT"
    navigation_entries: ["envelope:contract-existence", "area:agreements-contracts-terms"]
    reader_status: "DEFERRED"
    evidence_boundary: "腿字段可定位，组成关系未审阅。"
  - id: "concept:economic-terms"
    label_zh: "经济条款"
    stable_definition: "约束合同或合约腿经济结果的数值和条件集合。"
    excludes: ["Trade Contract legal identity", "Lifecycle Event"]
    concept_type: "CONTROL"
    navigation_entries: ["envelope:contract-existence", "area:agreements-contracts-terms"]
    reader_status: "DEFERRED"
    evidence_boundary: "当前只作组织层候选。"
  - id: "concept:position"
    label_zh: "持仓"
    stable_definition: "指定时点、范围和口径下的持有记录或数量状态。"
    excludes: ["Order quantity", "sync task count", "Risk Exposure"]
    concept_type: "OBJECT"
    navigation_entries: ["envelope:contract-existence", "activity:valuation-risk", "area:positions-risk"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "持仓数量有多物理实现；需按字段实例和表分别去重。"
  - id: "concept:position-view"
    label_zh: "头寸"
    stable_definition: "对持仓按账户、组合、方向或净额口径形成的业务视图或度量。"
    excludes: ["Position by default", "Risk Exposure"]
    concept_type: "MEASURE"
    navigation_entries: ["area:positions-risk"]
    reader_status: "DEFERRED"
    evidence_boundary: "术语与持仓混用，需业务裁定。"
  - id: "concept:notional"
    label_zh: "名义本金"
    stable_definition: "用于计算现金流、风险或条款规模的合同度量基准。"
    excludes: ["Position", "Margin", "Payment amount"]
    concept_type: "MEASURE"
    navigation_entries: ["envelope:contract-existence", "activity:valuation-risk", "area:agreements-contracts-terms"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "初始/动态/币种/方向表达有字段支持和冲突。"
  - id: "concept:valuation"
    label_zh: "估值"
    stable_definition: "在给定时点和方法下计算合同或持仓价值的过程。"
    excludes: ["price input", "Risk Exposure", "Margin"]
    concept_type: "PROCESS"
    navigation_entries: ["activity:valuation-risk", "area:valuation"]
    reader_status: "DEFERRED"
    evidence_boundary: "来源字段不能单独确认过程。"
  - id: "concept:risk-exposure"
    label_zh: "风险敞口"
    stable_definition: "基于风险方法、情景或净额计算的潜在损失或敏感度度量。"
    excludes: ["Position", "Notional"]
    concept_type: "MEASURE"
    navigation_entries: ["activity:valuation-risk", "area:positions-risk"]
    reader_status: "DEFERRED"
    evidence_boundary: "无首批独立证据链。"
  - id: "concept:margin"
    label_zh: "保证金"
    stable_definition: "为覆盖履约风险而计算、要求或记录的保证金额度或状态。"
    excludes: ["Collateral asset", "Valuation", "generic amount"]
    concept_type: "MEASURE"
    navigation_entries: ["activity:margin-collateral", "activity:valuation-risk", "area:margin-collateral"]
    reader_status: "REWORKED_CANDIDATE"
    evidence_boundary: "MARGIN_DIRECTION 的收付含义仍未解析。"
  - id: "concept:collateral"
    label_zh: "抵押品"
    stable_definition: "为满足保证金或信用支持义务而提供、占用或释放的资产。"
    excludes: ["Margin amount", "Notional"]
    concept_type: "OBJECT"
    navigation_entries: ["activity:margin-collateral", "area:margin-collateral"]
    reader_status: "DEFERRED"
    evidence_boundary: "相关语义存在 Conflict，不补造实体。"
  - id: "concept:cash-flow"
    label_zh: "现金流"
    stable_definition: "由合同条款或事件产生的计划或实际收付义务记录。"
    excludes: ["Payment event", "Settlement Result"]
    concept_type: "OBJECT"
    navigation_entries: ["activity:cashflow-obligation", "area:cashflow-clearing-settlement"]
    reader_status: "DEFERRED"
    evidence_boundary: "当前 Reader 阶段为空且语料碎片化。"
  - id: "concept:delivery"
    label_zh: "交割"
    stable_definition: "按义务交付约定资产或标的的履行动作。"
    excludes: ["Clearing", "Settlement Result"]
    concept_type: "EVENT"
    navigation_entries: ["activity:payment-transfer-delivery", "area:cashflow-clearing-settlement"]
    reader_status: "DEFERRED"
    evidence_boundary: "交割 token 不足以证明业务链位置。"
  - id: "concept:clearing"
    label_zh: "清算"
    stable_definition: "对交易义务进行确认、匹配、净额化或形成结算指令的过程。"
    excludes: ["Payment", "Delivery", "Settlement Result"]
    concept_type: "PROCESS"
    navigation_entries: ["activity:clearing", "area:cashflow-clearing-settlement"]
    reader_status: "DEFERRED"
    evidence_boundary: "当前清算入口为空。"
  - id: "concept:settlement-result"
    label_zh: "结算结果"
    stable_definition: "记录结算义务履行成功、失败、部分完成或待处理的结果。"
    excludes: ["Cash Flow", "Settlement Obligation", "technical task status"]
    concept_type: "OBJECT"
    navigation_entries: ["activity:settlement-result", "area:cashflow-clearing-settlement"]
    reader_status: "DEFERRED"
    evidence_boundary: "需区分业务结果与作业状态。"

