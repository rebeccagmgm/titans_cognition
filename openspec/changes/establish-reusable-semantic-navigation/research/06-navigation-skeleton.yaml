attribute_axes:
  - id: "IDENTIFIER"
    label_zh: "标识"
    definition: "在明确对象语境内标识实例。"
    exclusions: ["bare ID", "UUID", "batch number as business concept"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "DESCRIPTIVE_TEXT"
    label_zh: "名称与描述"
    definition: "名称、简称、描述和备注等可读表达。"
    exclusions: ["short/long name as position side", "abbreviation as concept"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "PARTY_RELATIONSHIP"
    label_zh: "主体关系"
    definition: "明确描述 Party 与机构、协议或交易之间的关系。"
    exclusions: ["BUY/SELL", "SOURCE/TARGET", "LONG/SHORT"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "BUSINESS_OBJECT_STATE"
    label_zh: "业务对象状态"
    definition: "必须命名所属业务对象的状态属性。"
    exclusions: ["bare 状态", "technical job status", "cross-object state merge"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "MEASURE"
    label_zh: "度量"
    definition: "数量、金额、比率或其他可计算度量。"
    exclusions: ["bare 金额/数量 as concept"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "CURRENCY"
    label_zh: "币种"
    definition: "币种身份或度量的币种基准。"
    exclusions: ["bare 币种 as concept", "data source"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "TIME"
    label_zh: "业务时间"
    definition: "业务日期、时点、区间或期限。"
    exclusions: ["created/updated audit time"]
    portability: "CROSS_SCHEMA_CANDIDATE"
  - id: "AUDIT"
    label_zh: "审计与处理追踪"
    definition: "创建、修改、版本、批次和处理追踪。"
    exclusions: ["business object promotion from co-location"]
    portability: "CROSS_SCHEMA_CANDIDATE"

rejected_attribute_axes:
  - id: "DIRECTION"
    reason: "Conflates position, trade, cashflow, mapping, and source meanings."
  - id: "CONFIGURATION"
    reason: "Technical/business configuration is context or area, not a reusable field attribute."
  - id: "OPEN"
    reason: "Governance state is not a field attribute axis."

qualifier_registry:
  - id: "observation_time_role"
    label_zh: "观察时点角色"
    definition: "表达相对于业务观察时点的角色。"
    allowed_values: ["INITIAL", "CURRENT", "END", "BEFORE_ADJUSTMENT", "AFTER_ADJUSTMENT"]
    applicable_layers: ["B", "D"]
    exclusions: ["lifecycle stage", "audit timestamp"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "初始名义本金"
    negative_example: "CREATED_DATETIME"
    status: "CANDIDATE"
  - id: "position_side"
    label_zh: "持仓方向"
    definition: "持仓或明确仓位语境的多空方向。"
    allowed_values: ["LONG", "SHORT"]
    applicable_layers: ["B", "D"]
    exclusions: ["name length", "SHORT_NAME", "LONG_NAME", "BUY/SELL"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "空头动态名义本金"
    negative_example: "交易对手短名"
    status: "CANDIDATE"
  - id: "trade_side"
    label_zh: "交易买卖侧"
    definition: "交易或明确成交语境的买卖侧。"
    allowed_values: ["BUY", "SELL"]
    applicable_layers: ["B", "D"]
    exclusions: ["position LONG/SHORT", "SOURCE/TARGET"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "买入数量"
    negative_example: "源侧交易对手"
    status: "CANDIDATE"
  - id: "cashflow_direction"
    label_zh: "现金流收付方向"
    definition: "经济现金流的支付或收取方向。"
    allowed_values: ["PAY", "RECEIVE"]
    applicable_layers: ["B", "D"]
    exclusions: ["generic direction", "position side", "mapping side"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "保证金支付方向"
    negative_example: "保证金方向（无值语义）"
    status: "CANDIDATE"
  - id: "currency_basis"
    label_zh: "币种基准"
    definition: "度量或表达采用的币种口径。"
    allowed_values: ["ORIGINAL", "LOCAL", "UNDERLYING", "SETTLEMENT"]
    applicable_layers: ["B", "D"]
    exclusions: ["currency code identity", "source system"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "动态名义本金（结算币种）"
    negative_example: "币种"
    status: "CANDIDATE"
  - id: "party_relationship_role"
    label_zh: "主体关系角色"
    definition: "Party 在明确机构、协议或交易关系中的角色。"
    allowed_values: ["CUSTOMER", "COUNTERPARTY", "INTERNAL_PARTY", "EXTERNAL_PARTY"]
    applicable_layers: ["B", "D"]
    exclusions: ["BUY", "SELL", "SOURCE", "TARGET", "LONG", "SHORT"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "合同交易对手"
    negative_example: "目标交易对手的裸 TARGET"
    status: "CANDIDATE"
  - id: "variability"
    label_zh: "可变性"
    definition: "条款或度量是否按规则动态变化。"
    allowed_values: ["DYNAMIC", "FIXED"]
    applicable_layers: ["B", "D"]
    exclusions: ["CURRENT", "INITIAL"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "动态名义本金"
    negative_example: "当前名义本金"
    status: "CANDIDATE"
  - id: "aggregation_state"
    label_zh: "聚合口径"
    definition: "明确声明的累计、净额或总额口径。"
    allowed_values: ["ACCUMULATED", "NET", "GROSS"]
    applicable_layers: ["B", "D"]
    exclusions: ["TOTAL token without context", "table-level voting"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "注释明确汇总前数量求和"
    negative_example: "字段名含 TOTAL"
    status: "DEFERRED"
  - id: "availability_condition"
    label_zh: "可用条件"
    definition: "度量或资产是否可用或冻结。"
    allowed_values: ["AVAILABLE", "FROZEN"]
    applicable_layers: ["B", "D"]
    exclusions: ["business object lifecycle state", "technical task freeze"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "可用保证金"
    negative_example: "冻结任务"
    status: "CANDIDATE"
  - id: "estimation_status"
    label_zh: "估算状态"
    definition: "度量是估算值还是观察值。"
    allowed_values: ["ESTIMATED", "OBSERVED"]
    applicable_layers: ["B", "D"]
    exclusions: ["SUPPORTED", "PROVISIONAL", "evidence state"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "估算现金流"
    negative_example: "Reader SUPPORTED"
    status: "CANDIDATE"
  - id: "measure_basis"
    label_zh: "度量基准"
    definition: "度量采用绝对值、比率或百分比口径。"
    allowed_values: ["ABSOLUTE", "RATIO", "PERCENTAGE"]
    applicable_layers: ["B", "D"]
    exclusions: ["measure_state", "generic amount"]
    portability: "CROSS_SCHEMA_CANDIDATE"
    positive_example: "内在价值系数"
    negative_example: "金额"
    status: "CANDIDATE"
  - id: "flow_side"
    label_zh: "数据流侧"
    definition: "明确数据加工或映射语境中的源侧或目标侧。"
    allowed_values: ["SOURCE", "TARGET"]
    applicable_layers: ["B", "D"]
    exclusions: ["business source", "event source", "valuation source", "party role"]
    portability: "TRADEFLOW_ONLY"
    positive_example: "明确源侧映射输入"
    negative_example: "事件来源类型"
    status: "CANDIDATE"

rejected_qualifiers:
  - id: "lifecycle_stage"
    reason: "Navigation placement is not a field qualifier."
  - id: "measure_state"
    reason: "Duplicates object state, time role, or aggregation semantics."
  - id: "attribute_kind"
    reason: "IDENTIFIER belongs to the field attribute layer."

semantic_prohibitions:
  - id: "PROHIBIT-BARE-SHORT-LONG"
    trigger: "Bare SHORT or LONG token"
    forbidden_decision: "Create position_side or publish a Reader expression."
    required_context: ["protected phrase", "raw comment", "business object context"]
    correct_home: "Name expression or unresolved qualifier observation."
    unresolved_result: "UNRESOLVED_OBSERVATION"
  - id: "PROHIBIT-BARE-SOURCE-TARGET"
    trigger: "Bare SOURCE or TARGET token"
    forbidden_decision: "Create flow_side or party role."
    required_context: ["explicit processing/mapping context", "raw name/comment", "table context"]
    correct_home: "Business source, mapping role, or TRADEFLOW-only flow_side."
    unresolved_result: "UNRESOLVED_OBSERVATION"
  - id: "PROHIBIT-GENERIC-CONCEPT"
    trigger: "状态/类型/金额/币种/日期/简称/缩写"
    forbidden_decision: "Publish as a standalone business concept."
    required_context: ["object anchor", "same-field evidence"]
    correct_home: "Field attribute or unbound attribute observation."
    unresolved_result: "UNBOUND_ATTRIBUTE_OBSERVATION"
  - id: "PROHIBIT-ORDER-TRADE-MERGE"
    trigger: "Order and Trade share a table, token, or physical name."
    forbidden_decision: "Merge Reader identity or inherit identifiers."
    required_context: ["object responsibility", "event state", "identifier evidence"]
    correct_home: "reader:order or reader:trade"
    unresolved_result: "NOT_PUBLISHED"
  - id: "PROHIBIT-CUSTOMER-COUNTERPARTY-MERGE"
    trigger: "Customer/Counterparty wording overlap"
    forbidden_decision: "Treat the relations as synonyms."
    required_context: ["eligibility relationship", "agreement/trade relationship"]
    correct_home: "concept:customer or concept:counterparty"
    unresolved_result: "CONFLICT"
  - id: "PROHIBIT-POSITION-EXPOSURE-MERGE"
    trigger: "Position, 头寸, and Risk Exposure wording overlap"
    forbidden_decision: "Reuse one concept identity."
    required_context: ["time point", "aggregation scope", "risk method"]
    correct_home: "Position, Position View, or Risk Exposure"
    unresolved_result: "DEFERRED"
  - id: "PROHIBIT-VALUE-MARGIN-COLLATERAL-CASHFLOW-MERGE"
    trigger: "Co-location in valuation or margin tables"
    forbidden_decision: "Reuse one concept identity."
    required_context: ["process/measure/asset/obligation role"]
    correct_home: "Valuation, Margin, Collateral, or Cash Flow"
    unresolved_result: "NOT_PUBLISHED"
  - id: "PROHIBIT-CONTRACT-LAYER-MERGE"
    trigger: "合同/合约 wording"
    forbidden_decision: "Merge Agreement, Trade Contract, Contract Leg, and Economic Terms."
    required_context: ["legal scope", "composition", "term carrier"]
    correct_home: "One explicit contract-layer identity"
    unresolved_result: "DEFERRED"
  - id: "PROHIBIT-SETTLEMENT-CHAIN-MERGE"
    trigger: "结算/清算/交割 wording"
    forbidden_decision: "Collapse obligation, process, fulfillment, delivery, and result."
    required_context: ["input obligation", "action", "asset kind", "result"]
    correct_home: "Clearing, Settlement Obligation, Payment/Transfer, Delivery, or Settlement Result"
    unresolved_result: "DEFERRED"
  - id: "PROHIBIT-TECHNICAL-PROMOTION"
    trigger: "CREATED/UPDATED/BATCH/PUSH/UUID or technical-field candidate"
    forbidden_decision: "Publish as a business concept or Reader."
    required_context: ["raw physical fact", "technical observation"]
    correct_home: "AUDIT or technical-processing area"
    unresolved_result: "ISOLATED_TECHNICAL"
  - id: "PROHIBIT-CONFLICT-AUTO-RESOLUTION"
    trigger: "Column name and comment conflict"
    forbidden_decision: "Overwrite one source or choose a fixed priority."
    required_context: ["both raw strings", "table context", "independent evidence"]
    correct_home: "Conflict record with competing interpretations"
    unresolved_result: "CONFLICT"
  - id: "PROHIBIT-TABLE-VOTING"
    trigger: "Table name or sibling majority"
    forbidden_decision: "Vote a field into a concept, qualifier, or Reader."
    required_context: ["locatable field-level evidence"]
    correct_home: "CONTEXT_ONLY"
    unresolved_result: "UNRESOLVED"

