[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titans-cognition"
version = "0.1.0"
description = "Evidence-grounded cognition reconstruction from read-only TITANS metadata"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "igraph==1.0.0",
    "leidenalg==0.11.0",
]

[project.scripts]
titans-cognition = "titans_cognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-q"]
